                  x: 34
                  width: 102
                  long_mode: DOT
                  styles: cyd_text_5
                  text: Flur
              - label:
                  id: w_home_l_state
                  align: BOTTOM_LEFT
                  x: 34
                  width: 102
                  long_mode: DOT
