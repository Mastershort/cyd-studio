              - label:
                  id: w_home_a_state
                  align: BOTTOM_LEFT
                  x: 34
                  width: 102
                  long_mode: DOT
                  styles: cyd_text_3
                  text: "–"
        - button:
            id: w_home_g
            x: 164
            y: 104
            width: 148
            height: 60
            scrollable: false
            on_short_click:
              - homeassistant.action:
                  action: script.turn_on
