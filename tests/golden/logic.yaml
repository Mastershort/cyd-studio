        - button:
            id: w_home_l
            x: 164
            y: 36
            width: 148
            height: 60
            scrollable: false
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: "${ent_light_flur}"
            on_long_press:
              - script.execute:
                  id: cyd_overlay_open
                  entity: "${ent_light_flur}"
                  title: Flur
                  kind: 1
                  value: !lambda |-
                    return id(cyd_percent)(id(ha_light_flur).state, id(ha_light_flur_brightness_num).state, 1);
            widgets:
              - label:
                  id: w_home_l_icon
