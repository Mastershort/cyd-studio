# ======================================================================
# Erzeugt von CYD Studio (Generator 0.7.0) – ESPHome >= 2026.9.0
# Projekt: Steuerung · Board: ESP32-2432S028R (Cheap Yellow Display 2,8″)
# Stand: 2026-09-24
#
# Änderungen bitte in CYD Studio vornehmen – sonst werden sie beim
# nächsten Export überschrieben.
#
# WLAN-Zugangsdaten kommen aus secrets.yaml (wifi_ssid, wifi_password).
# In Home Assistant beim ESPHome-Gerät „Dem Gerät erlauben,
# Home-Assistant-Aktionen auszuführen“ aktivieren – sonst reagieren
# die Schalter nicht.
#
# Hardware-Grundkonfiguration nach github.com/akuehlewind/ESPHome-touch-display-mount (MIT, (c) 2023 Adrian Kuehlewind)
# ======================================================================

substitutions:
  device_name: cyd-controls
  friendly_name: Steuerung
  ent_climate_wohnzimmer: climate.wohnzimmer
  ent_cover_rollo: cover.rollo
  ent_input_number_soll: input_number.soll
  ent_light_decke: light.decke
  ent_media_player_kueche: media_player.kueche
  ent_sensor_co2: sensor.co2
  ent_sensor_feuchte: sensor.feuchte
  ent_sensor_pv_leistung: sensor.pv_leistung
  ent_sensor_temp: sensor.temp
  ent_weather_home: weather.home

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  actions:
    - action: show_page
      variables:
        page: string
      then:
        - light.turn_on:
            id: backlight
            brightness: "100%"
        - if:
            condition:
              lambda: !lambda |-
                return page == "Klima" || page == "klima";
            then:
              - lvgl.page.show: page_klima
        - if:
            condition:
              lambda: !lambda |-
                return page == "Steuern" || page == "steuer";
            then:
              - lvgl.page.show: page_steuer
    - action: show_message
      variables:
        title: string
        message: string
        duration: int
      then:
        - script.execute:
            id: cyd_show_message
            title: !lambda |-
              return title.str();
            message: !lambda |-
              return message.str();
            duration: !lambda |-
              return duration;
    - action: wake
      then:
        - light.turn_on:
            id: backlight
            brightness: "100%"
    - action: dim
      then:
        - light.turn_on:
            id: backlight
            brightness: "25%"
    - action: set_brightness
      variables:
        brightness: int
      then:
        - light.turn_on:
            id: backlight
            brightness: !lambda |-
              return std::max(1, std::min(100, (int) brightness)) / 100.0f;

ota:
  - platform: esphome
    id: cyd_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Steuerung Fallback"

captive_portal:

globals:
  - id: cyd_page
    type: int
    restore_value: false
    initial_value: "0"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: cyd_update_time
    on_time:
      - seconds: 0
        minutes: "/1"
        then:
          - script.execute: cyd_update_time

spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: spi_display
    model: ILI9341
    color_order: BGR
    data_rate: 10MHz
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 20ms
    threshold: 300
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display-Beleuchtung
    id: backlight
    restore_mode: ALWAYS_ON

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    update_interval: 60s
    entity_category: diagnostic
  - platform: homeassistant
    id: ha_climate_wohnzimmer_temperature_num
    entity_id: "${ent_climate_wohnzimmer}"
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: w_klima_c_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[12];
              snprintf(buf, sizeof(buf), "%.1f°", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_climate_wohnzimmer_current_temperature_num
    entity_id: "${ent_climate_wohnzimmer}"
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: w_klima_c_state
            text: !lambda |-
              const std::string st = id(ha_climate_wohnzimmer).state;
              auto mode = [&]() -> std::string {
              if (st == "off") return std::string("Aus");
              if (st == "heat") return std::string("Heizen");
              if (st == "cool") return std::string("Kühlen");
              if (st == "heat_cool") return std::string("Heizen/Kühlen");
              if (st == "auto") return std::string("Automatik");
              if (st == "dry") return std::string("Entfeuchten");
              if (st == "fan_only") return std::string("Lüften");
              if (st == "unavailable") return std::string("Nicht verfügbar");
              return std::string("–");
              }();
              const float c = id(ha_climate_wohnzimmer_current_temperature_num).state;
              if (std::isnan(c)) return mode;
              char buf[48];
              snprintf(buf, sizeof(buf), "%s · %.1f°", mode.c_str(), c);
              return std::string(buf);
  - platform: homeassistant
    id: ha_sensor_pv_leistung_num
    entity_id: "${ent_sensor_pv_leistung}"
    on_value:
      then:
        - lvgl.arc.update:
            id: w_klima_g_arc
            value: !lambda |-
              if (std::isnan(x)) return 0;
              return (int) lroundf(std::min((float) 8000, std::max((float) 0, x)));
        - lvgl.label.update:
            id: w_klima_g_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf) + " W";
  - platform: homeassistant
    id: ha_cover_rollo_current_position_num
    entity_id: "${ent_cover_rollo}"
    attribute: current_position
    on_value:
      then: []
  - platform: homeassistant
    id: ha_light_decke_brightness_num
    entity_id: "${ent_light_decke}"
    attribute: brightness
    on_value:
      then:
        - lvgl.slider.update:
            id: w_steuer_s1_slider
            value: !lambda |-
              float v = id(ha_light_decke_brightness_num).state;
              if (std::isnan(v)) return 0.0f;
              if (id(ha_light_decke).state == "off") return 0.0f;
              return v * 100.0f / 255.0f;
        - lvgl.label.update:
            id: w_steuer_s1_value
            text: !lambda |-
              const float cur = [&]() -> float {
              float v = id(ha_light_decke_brightness_num).state;
              if (std::isnan(v)) return 0.0f;
              if (id(ha_light_decke).state == "off") return 0.0f;
              return v * 100.0f / 255.0f;
              }();
              char buf[16];
              snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(cur));
              return std::string(buf);
  - platform: homeassistant
    id: ha_media_player_kueche_volume_level_num
    entity_id: "${ent_media_player_kueche}"
    attribute: volume_level
    on_value:
      then:
        - lvgl.slider.update:
            id: w_steuer_s2_slider
            value: !lambda |-
              float v = id(ha_media_player_kueche_volume_level_num).state;
              if (std::isnan(v)) return 0.0f;
              if (id(ha_media_player_kueche).state == "off") return 0.0f;
              return v * 100.0f;
        - lvgl.label.update:
            id: w_steuer_s2_value
            text: !lambda |-
              const float cur = [&]() -> float {
              float v = id(ha_media_player_kueche_volume_level_num).state;
              if (std::isnan(v)) return 0.0f;
              if (id(ha_media_player_kueche).state == "off") return 0.0f;
              return v * 100.0f;
              }();
              char buf[16];
              snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(cur));
              return std::string(buf);
  - platform: homeassistant
    id: ha_input_number_soll_num
    entity_id: "${ent_input_number_soll}"
    on_value:
      then:
        - lvgl.slider.update:
            id: w_steuer_s3_slider
            value: !lambda |-
              float v = id(ha_input_number_soll_num).state;
              if (std::isnan(v)) return 0.0f;
              return v;
        - lvgl.label.update:
            id: w_steuer_s3_value
            text: !lambda |-
              const float cur = [&]() -> float {
              float v = id(ha_input_number_soll_num).state;
              if (std::isnan(v)) return 0.0f;
              return v;
              }();
              char buf[16];
              snprintf(buf, sizeof(buf), "%d °C", (int) lroundf(cur));
              return std::string(buf);
  - platform: homeassistant
    id: ha_weather_home_temperature_num
    entity_id: "${ent_weather_home}"
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: w_steuer_w_temp
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[12];
              snprintf(buf, sizeof(buf), "%.0f°", x);
              return std::string(buf);
  - platform: homeassistant
    id: ha_weather_home_humidity_num
    entity_id: "${ent_weather_home}"
    attribute: humidity
    on_value:
      then:
        - lvgl.label.update:
            id: w_steuer_w_state
            text: !lambda |-
              const std::string st = id(ha_weather_home).state;
              const std::string t = [&]() -> std::string {
              if (st == "clear-night") return std::string("Klare Nacht");
              if (st == "cloudy") return std::string("Bewölkt");
              if (st == "exceptional") return std::string("Unwetter");
              if (st == "fog") return std::string("Nebel");
              if (st == "hail") return std::string("Hagel");
              if (st == "lightning") return std::string("Gewitter");
              if (st == "lightning-rainy") return std::string("Gewitter, Regen");
              if (st == "partlycloudy") return std::string("Teilweise bewölkt");
              if (st == "pouring") return std::string("Starkregen");
              if (st == "rainy") return std::string("Regen");
              if (st == "snowy") return std::string("Schnee");
              if (st == "snowy-rainy") return std::string("Schneeregen");
              if (st == "sunny") return std::string("Sonnig");
              if (st == "windy") return std::string("Windig");
              if (st == "windy-variant") return std::string("Windig, bewölkt");
              return std::string("–");
              }();
              const float h = id(ha_weather_home_humidity_num).state;
              if (std::isnan(h)) return t;
              char buf[64];
              snprintf(buf, sizeof(buf), "%s · %d %%", t.c_str(), (int) lroundf(h));
              return std::string(buf);
  - platform: homeassistant
    id: ha_sensor_temp_num
    entity_id: "${ent_sensor_temp}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_steuer_m_v0
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf) + " °C";
  - platform: homeassistant
    id: ha_sensor_feuchte_num
    entity_id: "${ent_sensor_feuchte}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_steuer_m_v1
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf) + " %";
  - platform: homeassistant
    id: ha_sensor_co2_num
    entity_id: "${ent_sensor_co2}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_steuer_m_v2
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf) + " ppm";

