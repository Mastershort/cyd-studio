script:
  - id: cyd_show_message
    mode: restart
    parameters:
      title: string
      message: string
      duration: int
    then:
      - lvgl.label.update:
          id: cyd_msg_title
          text: !lambda |-
            return title;
      - lvgl.label.update:
          id: cyd_msg_text
          text: !lambda |-
            return message;
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - lvgl.widget.show: cyd_msg
      - if:
          condition:
            lambda: !lambda |-
              return duration > 0;
          then:
            - delay: !lambda |-
                return (uint32_t) duration * 1000;
            - lvgl.widget.hide: cyd_msg
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Klima", "Steuern"};
            if (page < 0 || page >= 2) return std::string("");
            return std::string(names[page]);
      - if:
          condition:
            lambda: !lambda |-
              return root == 0;
          then:
            - lvgl.label.update:
                id: cyd_tab_klima_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_klima_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_klima_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_klima_label
                text_color: 0x8B98A5
      - if:
          condition:
            lambda: !lambda |-
              return root == 1;
          then:
            - lvgl.label.update:
                id: cyd_tab_steuer_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_steuer_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_steuer_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_steuer_label
                text_color: 0x8B98A5

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 90
  page_wrap: false
  theme:
    button:
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      shadow_width: 0
      pad_all: 5
      text_color: 0xE6EDF3
      pressed:
        bg_color: 0x1B2430
      checked:
        bg_color: 0x1B2430
        bg_opa: COVER
        border_color: 0x22D3EE
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      pad_all: 5
      shadow_width: 0
    - id: cyd_plain
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
      shadow_width: 0
    - id: cyd_bar
      bg_color: 0x0A0E14
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_navbar
      bg_color: 0x12171F
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_text_1
      text_font: font_12
      text_color: 0x8B98A5
    - id: cyd_text_2
      text_font: font_12
      text_color: 0x8B98A5
      text_align: CENTER
    - id: cyd_text_3
      text_font: font_16
      text_color: 0xE6EDF3
      text_align: CENTER
    - id: cyd_text_4
      text_font: icons_20
      text_color: 0xA3E635
    - id: cyd_text_5
      text_font: font_14
      text_color: 0xE6EDF3
    - id: cyd_text_6
      text_font: font_12
      text_color: 0x8B98A5
      text_align: RIGHT
    - id: cyd_text_7
      text_font: icons_28
      text_color: 0xA3E635
    - id: cyd_text_8
      text_font: font_20
      text_color: 0xE6EDF3
    - id: cyd_text_9
      text_font: icons_20
      text_color: 0x22D3EE
    - id: cyd_text_10
      text_font: font_12
      text_color: 0x22D3EE
      text_align: CENTER
    - id: cyd_text_11
      text_font: icons_20
      text_color: 0x8B98A5
    - id: cyd_text_12
      text_font: font_16
      text_color: 0xE6EDF3
    - id: cyd_text_13
      text_font: font_14
      text_color: 0x8B98A5
    - id: cyd_small_btn
      bg_color: 0x1B2430
      bg_opa: COVER
      radius: 10
      border_width: 0
      pad_all: 0
      shadow_width: 0
  on_idle:
    - timeout: 30s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 0;
            then:
              - lvgl.page.show: page_klima
  top_layer:
    widgets:
      - obj:
          id: cyd_header
          x: 0
          y: 0
          width: 320
          height: 28
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                id: cyd_title
                align: LEFT_MID
                styles: cyd_text_5
                text: Klima
            - label:
                id: cyd_header_time
                align: RIGHT_MID
                styles: cyd_text_5
                text: "--:--"
      - obj:
          id: cyd_tabbar
          x: 0
          y: 200
          width: 320
          height: 40
          styles: cyd_navbar
          scrollable: false
          clickable: false
          widgets:
            - button:
                id: cyd_tab_klima
                x: 0
                y: 0
                width: 160
                height: 40
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_klima
                widgets:
                  - label:
                      id: cyd_tab_klima_icon
                      align: TOP_MID
                      y: 2
                      styles: cyd_text_9
                      text: "\U000F0393"
                  - label:
                      id: cyd_tab_klima_label
                      align: BOTTOM_MID
                      y: -1
                      width: 158
                      long_mode: DOT
                      styles: cyd_text_10
                      text: Klima
            - button:
                id: cyd_tab_steuer
                x: 160
                y: 0
                width: 160
                height: 40
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_steuer
                widgets:
                  - label:
                      id: cyd_tab_steuer_icon
                      align: TOP_MID
                      y: 2
                      styles: cyd_text_11
                      text: "\U000F062E"
                  - label:
                      id: cyd_tab_steuer_label
                      align: BOTTOM_MID
                      y: -1
                      width: 158
                      long_mode: DOT
                      styles: cyd_text_2
                      text: Steuern
      - obj:
          id: cyd_msg
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: "50%"
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: true
          scrollable: false
          on_short_click:
            - lvgl.widget.hide: cyd_msg
          widgets:
            - obj:
                x: 30
                y: 50
                width: 260
                height: 140
                styles: cyd_tile
                border_color: 0x22D3EE
                border_width: 2
                pad_all: 4
                scrollable: false
                clickable: false
                widgets:
                  - label:
                      align: TOP_LEFT
                      styles: cyd_text_9
                      text: "\U000F009F"
                  - label:
                      id: cyd_msg_title
                      align: TOP_LEFT
                      x: 26
                      width: 222
                      long_mode: DOT
                      styles: cyd_text_12
                      text: ""
                  - label:
                      id: cyd_msg_text
                      align: TOP_LEFT
                      y: 26
                      width: 248
                      height: 102
                      long_mode: WRAP
                      styles: cyd_text_13
                      text: ""
  pages:
    - id: page_klima
      bg_color: 0x0A0E14
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 0
            root: 0
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 200ms
      widgets:
        - obj:
            id: w_klima_c
            x: 8
            y: 36
            width: 148
            height: 101
            styles: cyd_tile
            scrollable: false
            clickable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  width: 136
                  long_mode: DOT
                  styles: cyd_text_1
                  text: Heizung
              - label:
                  id: w_klima_c_state
                  align: BOTTOM_MID
                  width: 136
                  long_mode: DOT
                  styles: cyd_text_2
                  text: "–"
              - label:
                  id: w_klima_c_value
                  align: CENTER
                  width: 56
                  long_mode: DOT
                  styles: cyd_text_3
                  text: "--"
              - button:
                  align: LEFT_MID
                  width: 34
                  height: 34
                  styles: cyd_small_btn
                  on_short_click:
                    - homeassistant.action:
                        action: climate.set_temperature
                        data:
                          entity_id: "${ent_climate_wohnzimmer}"
                          temperature: !lambda |-
                            float t = id(ha_climate_wohnzimmer_temperature_num).state;
                            if (std::isnan(t)) t = 16.5f;
                            t = std::min(28.0f, std::max(5.0f, t + (-0.5f)));
                            char buf[12];
                            snprintf(buf, sizeof(buf), "%.1f", t);
                            return std::string(buf);
                  widgets:
                    - label:
                        align: CENTER
                        styles: cyd_text_4
                        text: "\U000F0374"
              - button:
                  align: RIGHT_MID
                  width: 34
                  height: 34
                  styles: cyd_small_btn
                  on_short_click:
                    - homeassistant.action:
                        action: climate.set_temperature
                        data:
                          entity_id: "${ent_climate_wohnzimmer}"
                          temperature: !lambda |-
                            float t = id(ha_climate_wohnzimmer_temperature_num).state;
                            if (std::isnan(t)) t = 16.5f;
                            t = std::min(28.0f, std::max(5.0f, t + (0.5f)));
                            char buf[12];
                            snprintf(buf, sizeof(buf), "%.1f", t);
                            return std::string(buf);
                  widgets:
                    - label:
                        align: CENTER
                        styles: cyd_text_4
                        text: "\U000F0415"
        - obj:
            id: w_klima_g
