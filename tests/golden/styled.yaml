# Erzeugt von CYD Studio (Generator 0.3.0) – ESPHome >= 2026.9.0
# Projekt: Stil-Test · Board: ESP32-2432S028R (Cheap Yellow Display 2,8″)
# Stand: 2026-09-24
#
# Änderungen bitte in CYD Studio vornehmen – sonst werden sie beim
# nächsten Export überschrieben.
#
# WLAN-Zugangsdaten kommen aus secrets.yaml (wifi_ssid, wifi_password).
# In Home Assistant beim ESPHome-Gerät „Dem Gerät erlauben,
# Home-Assistant-Aktionen auszuführen“ aktivieren – sonst reagieren
# die Schalter nicht.
#
# Hardware-Grundkonfiguration nach github.com/akuehlewind/ESPHome-touch-display-mount (MIT, (c) 2023 Adrian Kuehlewind)
# ======================================================================

substitutions:
  device_name: cyd-styled
  friendly_name: Stil-Test
  ent_binary_sensor_tuer: binary_sensor.tuer
  ent_cover_rollo: cover.rollo
  ent_light_decke: light.decke
  ent_light_stehlampe: light.stehlampe
  ent_scene_film: scene.film
  ent_sensor_temp: sensor.temp

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    id: cyd_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Stil-Test Fallback"

captive_portal:

globals:
  - id: cyd_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: cyd_tile_state
    type: "std::function<void(lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, const std::string &, float, int, const char *, const char *, const uint32_t *)>"
    restore_value: false
    initial_value: |-
      [](lv_obj_t *tile, lv_obj_t *icon, lv_obj_t *title, lv_obj_t *label, lv_obj_t *circle,
          const std::string &x, float value, int kind, const char *text_on, const char *text_off,
          const uint32_t *c) {
        // Tile state: checked when on/open, disabled when unavailable; colors c[] = on/off pairs of
        // icon, title, state text, icon circle. kind: 1 = brightness 0..255, 2/3 = percent, 0 = text only
        const bool on = x == "on" || x == "open" || x == "opening" || x == "unlocked" || x == "home" || x == "playing";
        const int k = on ? 0 : 1;
        if (tile != nullptr) {
          lv_obj_set_state(tile, LV_STATE_CHECKED, on);
          lv_obj_set_state(tile, LV_STATE_DISABLED, x == "unavailable");
        }
        if (icon != nullptr) lv_obj_set_style_text_color(icon, lv_color_hex(c[k]), LV_PART_MAIN);
        if (title != nullptr) lv_obj_set_style_text_color(title, lv_color_hex(c[2 + k]), LV_PART_MAIN);
        if (circle != nullptr) lv_obj_set_style_bg_color(circle, lv_color_hex(c[6 + k]), LV_PART_MAIN);
        if (label == nullptr) return;
        lv_obj_set_style_text_color(label, lv_color_hex(c[4 + k]), LV_PART_MAIN);
        std::string text;
        if (on && kind > 0 && !std::isnan(value)) {
          char buf[12];
          snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(kind == 1 ? value * 100.0f / 255.0f : value));
          text = buf;
        }
        else if (x == "unavailable") text = "Nicht verfügbar";
        else if (x.empty() || x == "unknown") text = "–";
        else if (x == "opening") text = "Öffnet";
        else if (x == "closing") text = "Schließt";
        else if (on && text_on != nullptr) text = text_on;
        else if (!on && text_off != nullptr) text = text_off;
        else if (x == "on") text = "An";
        else if (x == "off") text = "Aus";
        else if (x == "open") text = "Offen";
        else if (x == "closed") text = "Geschlossen";
        else if (x == "locked") text = "Verriegelt";
        else if (x == "unlocked") text = "Entriegelt";
        else text = x;
        lv_label_set_text(label, text.c_str());
      }
  - id: cyd_percent
    type: "std::function<float(const std::string &, float, int)>"
    restore_value: false
    initial_value: |-
      [](const std::string &state, float value, int kind) -> float {
        // Start value of the slider in percent (lights and fans: 0 when off)
        if (std::isnan(value)) return 0.0f;
        if (kind != 2 && state != "on") return 0.0f;
        return kind == 1 ? value * 100.0f / 255.0f : value;
      }
  - id: cyd_ov_entity
    type: "std::string"
    restore_value: false
  - id: cyd_ov_kind
    type: int
    restore_value: false
    initial_value: "0"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: cyd_update_time
    on_time:
      - seconds: 0
        minutes: "/1"
        then:
          - script.execute: cyd_update_time

spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: spi_display
    model: ILI9341
    color_order: BGR
    data_rate: 10MHz
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 20ms
    threshold: 300
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display-Beleuchtung
    id: backlight
    restore_mode: ALWAYS_ON

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    update_interval: 60s
    entity_category: diagnostic
  - platform: homeassistant
    id: ha_light_decke_brightness_num
    entity_id: "${ent_light_decke}"
    attribute: brightness
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xC7C7CC, 0x000000, 0xFFFFFF, 0x6E6E73, 0xC7C7CC, 0xFFCC00, 0x4A4A56};
            id(cyd_tile_state)(id(w_home_l1), id(w_home_l1_icon), id(w_home_l1_label), id(w_home_l1_state), id(w_home_l1_circle), id(ha_light_decke).state, x, 1, nullptr, nullptr, c);
  - platform: homeassistant
    id: ha_light_stehlampe_brightness_num
    entity_id: "${ent_light_stehlampe}"
    attribute: brightness
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xC7C7CC, 0x000000, 0xFFFFFF, 0x6E6E73, 0xC7C7CC, 0xFFCC00, 0x4A4A56};
            id(cyd_tile_state)(id(w_home_l2), id(w_home_l2_icon), id(w_home_l2_label), id(w_home_l2_state), id(w_home_l2_circle), id(ha_light_stehlampe).state, x, 1, nullptr, nullptr, c);
  - platform: homeassistant
    id: ha_cover_rollo_current_position_num
    entity_id: "${ent_cover_rollo}"
    attribute: current_position
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0x34C759, 0xC7C7CC, 0xFFFFFF, 0xFFFFFF, 0xFFFFFF, 0xC7C7CC, 0xFFCC00, 0x3A3A44};
            id(cyd_tile_state)(id(w_home_c1), id(w_home_c1_icon), id(w_home_c1_label), id(w_home_c1_state), id(w_home_c1_circle), id(ha_cover_rollo).state, x, 2, nullptr, nullptr, c);
  - platform: homeassistant
    id: ha_sensor_temp_num
    entity_id: "${ent_sensor_temp}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_home_t1_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf) + " °C";

text_sensor:
  - platform: homeassistant
    id: ha_light_decke
    entity_id: "${ent_light_decke}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xC7C7CC, 0x000000, 0xFFFFFF, 0x6E6E73, 0xC7C7CC, 0xFFCC00, 0x4A4A56};
            id(cyd_tile_state)(id(w_home_l1), id(w_home_l1_icon), id(w_home_l1_label), id(w_home_l1_state), id(w_home_l1_circle), x, id(ha_light_decke_brightness_num).state, 1, nullptr, nullptr, c);
  - platform: homeassistant
    id: ha_light_stehlampe
    entity_id: "${ent_light_stehlampe}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xFFFFFF, 0xC7C7CC, 0x000000, 0xFFFFFF, 0x6E6E73, 0xC7C7CC, 0xFFCC00, 0x4A4A56};
            id(cyd_tile_state)(id(w_home_l2), id(w_home_l2_icon), id(w_home_l2_label), id(w_home_l2_state), id(w_home_l2_circle), x, id(ha_light_stehlampe_brightness_num).state, 1, nullptr, nullptr, c);
  - platform: homeassistant
    id: ha_cover_rollo
    entity_id: "${ent_cover_rollo}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0x34C759, 0xC7C7CC, 0xFFFFFF, 0xFFFFFF, 0xFFFFFF, 0xC7C7CC, 0xFFCC00, 0x3A3A44};
            id(cyd_tile_state)(id(w_home_c1), id(w_home_c1_icon), id(w_home_c1_label), id(w_home_c1_state), id(w_home_c1_circle), x, id(ha_cover_rollo_current_position_num).state, 2, nullptr, nullptr, c);
  - platform: homeassistant
    id: ha_binary_sensor_tuer
    entity_id: "${ent_binary_sensor_tuer}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xFF3B30, 0xFFCC00, 0xFFFFFF, 0xFFFFFF, 0xC7C7CC, 0xC7C7CC, 0x2C2C34, 0x2C2C34};
            id(cyd_tile_state)(nullptr, id(w_home_b1_icon), nullptr, id(w_home_b1_state), id(w_home_b1_circle), x, NAN, 0, "Offen", "Zu", c);

