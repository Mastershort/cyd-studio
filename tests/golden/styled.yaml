script:
  - id: cyd_overlay_open
    mode: restart
    parameters:
      entity: string
      title: string
      kind: int
      value: float
    then:
      - lambda: !lambda |-
          id(cyd_ov_entity) = entity;
          id(cyd_ov_kind) = kind;
      - lvgl.label.update:
          id: cyd_ov_title
          text: !lambda |-
            return title;
      - lvgl.slider.update:
          id: cyd_ov_slider
          value: !lambda |-
            return value;
      - lvgl.label.update:
          id: cyd_ov_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(value));
            return std::string(buf);
      - lvgl.widget.show: cyd_overlay
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Wohnzimmer"};
            if (page < 0 || page >= 1) return std::string("");
            return std::string(names[page]);

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 90
  page_wrap: false
  theme:
    button:
      bg_color: 0x3A3A44
      bg_opa: COVER
      radius: 16
      border_width: 0
      border_color: 0x3A3A44
      shadow_width: 0
      pad_all: 6
      text_color: 0xFFFFFF
      pressed:
        bg_color: 0xF2F2F7
      checked:
        bg_color: 0xF2F2F7
        bg_opa: COVER
        border_color: 0xF2F2F7
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x3A3A44
      bg_opa: COVER
      radius: 16
      border_width: 0
      border_color: 0x3A3A44
      pad_all: 6
      shadow_width: 0
    - id: cyd_plain
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
      shadow_width: 0
    - id: cyd_bar
      bg_color: 0x1C1C24
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_navbar
      bg_color: 0x26262F
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_text_1
      text_font: icons_28
      text_color: 0xC7C7CC
    - id: cyd_text_2
      text_font: font_14
      text_color: 0xFFFFFF
    - id: cyd_text_3
      text_font: font_12
      text_color: 0xC7C7CC
    - id: cyd_text_4
      text_font: font_16
      text_color: 0xFFFFFF
    - id: cyd_text_5
      text_font: icons_28
      text_color: 0xFFCC00
    - id: cyd_text_6
      text_font: font_20
      text_color: 0xFFFFFF
    - id: cyd_text_7
      text_font: icons_28
      text_color: 0xFFFFFF
    - id: cyd_text_8
      text_font: icons_20
      text_color: 0xC7C7CC
    - id: cyd_text_9
      text_font: font_28
      text_color: 0xFFFFFF
      text_align: CENTER
  on_idle:
    - timeout: 30s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 0;
            then:
              - lvgl.page.show: page_home
  top_layer:
    widgets:
      - obj:
          id: cyd_header
          x: 0
          y: 0
          width: 320
          height: 28
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                id: cyd_title
                align: LEFT_MID
                styles: cyd_text_2
                text: Wohnzimmer
            - label:
                id: cyd_header_time
                align: RIGHT_MID
                styles: cyd_text_2
                text: "--:--"
      - obj:
          id: cyd_overlay
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: "60%"
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: true
          scrollable: false
          on_short_click:
            - lvgl.widget.hide: cyd_overlay
          widgets:
            - obj:
                id: cyd_ov_panel
                x: 40
                y: 45
                width: 240
                height: 150
                styles: cyd_tile
                scrollable: false
                widgets:
                  - label:
                      id: cyd_ov_title
                      align: TOP_LEFT
                      width: 202
                      long_mode: DOT
                      styles: cyd_text_4
                      text: ""
                  - label:
                      id: cyd_ov_close
                      align: TOP_RIGHT
                      styles: cyd_text_8
                      text: "\U000F0156"
                      on_short_click:
                        - lvgl.widget.hide: cyd_overlay
                  - label:
                      id: cyd_ov_value
                      align: CENTER
                      y: -9
                      width: 228
                      long_mode: DOT
                      styles: cyd_text_9
                      text: ""
                  - slider:
                      id: cyd_ov_slider
                      align: BOTTOM_MID
                      x: 0
                      y: -9
                      width: 192
                      height: 18
                      min_value: 0
                      max_value: 100
                      value: 0
                      bg_color: 0x3A3A44
                      bg_opa: COVER
                      indicator:
                        bg_color: 0xFFCC00
                        bg_opa: COVER
                      knob:
                        bg_color: 0xFFFFFF
                        bg_opa: COVER
                        pad_all: 4
                      on_value:
                        - lvgl.label.update:
                            id: cyd_ov_value
                            text: !lambda |-
                              char buf[12];
                              snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(x));
                              return std::string(buf);
                      on_release:
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 1;
                            then:
                              - homeassistant.action:
                                  action: light.turn_on
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    brightness_pct: !lambda |-
                                      return to_string((int) lroundf(x));
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 2;
                            then:
                              - homeassistant.action:
                                  action: cover.set_cover_position
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    position: !lambda |-
                                      return to_string((int) lroundf(x));
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 3;
                            then:
                              - homeassistant.action:
                                  action: fan.set_percentage
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    percentage: !lambda |-
                                      return to_string((int) lroundf(x));
  pages:
    - id: page_home
      bg_color: 0x1C1C24
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 0
            root: 0
      widgets:
        - button:
            id: w_home_l1
            x: 8
            y: 36
            width: 148
            height: 60
            scrollable: false
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: "${ent_light_decke}"
            on_long_press:
              - script.execute:
                  id: cyd_overlay_open
                  entity: "${ent_light_decke}"
                  title: Decke
                  kind: 1
                  value: !lambda |-
                    return id(cyd_percent)(id(ha_light_decke).state, id(ha_light_decke_brightness_num).state, 1);
            widgets:
              - obj:
                  id: w_home_l1_circle
                  align: LEFT_MID
                  width: 38
                  height: 38
                  radius: 38
                  bg_color: 0x4A4A56
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  clickable: false
                  widgets:
                    - label:
                        id: w_home_l1_icon
                        align: CENTER
                        styles: cyd_text_1
                        text: "\U000F0769"
              - label:
                  id: w_home_l1_label
                  align: TOP_LEFT
                  x: 44
                  width: 92
                  long_mode: DOT
                  styles: cyd_text_2
                  text: Decke
              - label:
                  id: w_home_l1_state
                  align: BOTTOM_LEFT
                  x: 44
                  width: 92
                  long_mode: DOT
                  styles: cyd_text_3
                  text: "–"
        - button:
            id: w_home_l2
            x: 164
            y: 36
            width: 70
            height: 128
            scrollable: false
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: "${ent_light_stehlampe}"
            on_long_press:
              - script.execute:
                  id: cyd_overlay_open
                  entity: "${ent_light_stehlampe}"
                  title: Stehlampe
                  kind: 1
                  value: !lambda |-
