# ======================================================================
# Erzeugt von CYD Studio (Generator 0.1.0) – ESPHome >= 2026.9.0
# Projekt: Wohnzimmer · Board: ESP32-2432S028R (Cheap Yellow Display 2,8″)
# Stand: 2026-09-24
#
# Änderungen bitte in CYD Studio vornehmen – sonst werden sie beim
# nächsten Export überschrieben.
#
# WLAN-Zugangsdaten kommen aus secrets.yaml (wifi_ssid, wifi_password).
# In Home Assistant beim ESPHome-Gerät „Dem Gerät erlauben,
# Home-Assistant-Aktionen auszuführen“ aktivieren – sonst reagieren
# die Schalter nicht.
#
# Hardware-Grundkonfiguration nach github.com/akuehlewind/ESPHome-touch-display-mount (MIT, (c) 2023 Adrian Kuehlewind)
# ======================================================================

substitutions:
  device_name: cyd-wohnzimmer
  friendly_name: Wohnzimmer
  ent_binary_sensor_fenster_wohnzimmer: binary_sensor.fenster_wohnzimmer
  ent_cover_rollladen: cover.rollladen
  ent_light_wohnzimmer: light.wohnzimmer
  ent_script_alles_aus: script.alles_aus
  ent_sensor_wohnzimmer_co2: sensor.wohnzimmer_co2
  ent_sensor_wohnzimmer_luftfeuchte: sensor.wohnzimmer_luftfeuchte
  ent_sensor_wohnzimmer_temperatur: sensor.wohnzimmer_temperatur
  ent_switch_stehlampe: switch.stehlampe

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "zGm1uI0T3MdsCWDhYxJ9t3iX0N9kfjN7l6BUk4kP1Ro="

ota:
  - platform: esphome
    id: cyd_ota
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wohnzimmer Fallback"

captive_portal:

globals:
  - id: cyd_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: cyd_dimmed
    type: bool
    restore_value: false
    initial_value: "false"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: cyd_update_time
    on_time:
      - seconds: 0
        minutes: "/1"
        then:
          - script.execute: cyd_update_time

spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: spi_display
    model: ILI9341
    color_order: BGR
    data_rate: 10MHz
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 20ms
    threshold: 300
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    on_touch:
      - if:
          condition:
            lambda: !lambda |-
              return id(cyd_dimmed);
          then:
            - lambda: !lambda |-
                id(cyd_dimmed) = false;
            - light.turn_on:
                id: backlight
                brightness: "100%"

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display-Beleuchtung
    id: backlight
    restore_mode: ALWAYS_ON

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    update_interval: 60s
    entity_category: diagnostic
  - platform: homeassistant
    id: ha_sensor_wohnzimmer_temperatur_num
    entity_id: "${ent_sensor_wohnzimmer_temperatur}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_home_w2_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf) + " °C";
  - platform: homeassistant
    id: ha_sensor_wohnzimmer_luftfeuchte_num
    entity_id: "${ent_sensor_wohnzimmer_luftfeuchte}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_klima_hum_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf) + " %";
  - platform: homeassistant
    id: ha_sensor_wohnzimmer_co2_num
    entity_id: "${ent_sensor_wohnzimmer_co2}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_klima_co2_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf) + " ppm";

