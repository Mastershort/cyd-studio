script:
  - id: cyd_overlay_open
    mode: restart
    parameters:
      entity: string
      title: string
      kind: int
      value: float
    then:
      - lambda: !lambda |-
          id(cyd_ov_entity) = entity;
          id(cyd_ov_kind) = kind;
      - lvgl.label.update:
          id: cyd_ov_title
          text: !lambda |-
            return title;
      - lvgl.slider.update:
          id: cyd_ov_slider
          value: !lambda |-
            return value;
      - lvgl.label.update:
          id: cyd_ov_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(value));
            return std::string(buf);
      - lvgl.widget.show: cyd_overlay
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: w_home_w1_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
      - lvgl.label.update:
          id: w_home_w1_date
          text: !lambda |-
            static const char *const days[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            static const char *const months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("");
            char buf[48];
            snprintf(buf, sizeof(buf), "%s, %d. %s", days[now.day_of_week - 1], now.day_of_month, months[now.month - 1]);
            return std::string(buf);
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - if:
          condition:
            lambda: !lambda |-
              return page == 2;
          then:
            - lvgl.widget.show: cyd_back
          else:
            - lvgl.widget.hide: cyd_back
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Start", "Klima", "Lichter"};
            if (page < 0 || page >= 3) return std::string("");
            return std::string(names[page]);
      - if:
          condition:
            lambda: !lambda |-
              return root == 0;
          then:
            - lvgl.label.update:
                id: cyd_tab_home_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_home_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_home_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_home_label
                text_color: 0x8B98A5
      - if:
          condition:
            lambda: !lambda |-
              return root == 1;
          then:
            - lvgl.label.update:
                id: cyd_tab_klima_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_klima_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_klima_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_klima_label
                text_color: 0x8B98A5

