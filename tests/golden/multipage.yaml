                  - label:
                      id: cyd_tab_klima_icon
                      align: TOP_MID
                      y: 2
                      styles: cyd_text_12
                      text: "\U000F0393"
                  - label:
                      id: cyd_tab_klima_label
                      align: BOTTOM_MID
                      y: -1
                      width: 158
                      long_mode: DOT
                      styles: cyd_text_2
                      text: Klima
      - obj:
          id: cyd_overlay
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: "60%"
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: true
          scrollable: false
          on_short_click:
            - lvgl.widget.hide: cyd_overlay
          widgets:
            - obj:
                id: cyd_ov_panel
                x: 40
                y: 45
                width: 240
                height: 150
                styles: cyd_tile
                scrollable: false
                widgets:
                  - label:
                      id: cyd_ov_title
                      align: TOP_LEFT
                      width: 202
                      long_mode: DOT
                      styles: cyd_text_13
                      text: ""
                  - label:
                      id: cyd_ov_close
                      align: TOP_RIGHT
                      styles: cyd_text_12
                      text: "\U000F0156"
                      on_short_click:
                        - lvgl.widget.hide: cyd_overlay
                  - label:
                      id: cyd_ov_value
                      align: CENTER
                      y: -9
                      width: 228
                      long_mode: DOT
                      styles: cyd_text_14
                      text: ""
                  - slider:
                      id: cyd_ov_slider
                      align: BOTTOM_MID
                      x: 0
                      y: -9
                      width: 192
                      height: 18
                      min_value: 0
                      max_value: 100
                      value: 0
                      bg_color: 0x1F2933
                      bg_opa: COVER
                      indicator:
                        bg_color: 0x22D3EE
                        bg_opa: COVER
                      knob:
                        bg_color: 0xE6EDF3
                        bg_opa: COVER
                        pad_all: 4
                      on_value:
                        - lvgl.label.update:
                            id: cyd_ov_value
                            text: !lambda |-
                              char buf[12];
                              snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(x));
                              return std::string(buf);
                      on_release:
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 1;
                            then:
                              - homeassistant.action:
                                  action: light.turn_on
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    brightness_pct: !lambda |-
                                      return to_string((int) lroundf(x));
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 2;
                            then:
                              - homeassistant.action:
                                  action: cover.set_cover_position
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    position: !lambda |-
                                      return to_string((int) lroundf(x));
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 3;
                            then:
                              - homeassistant.action:
                                  action: fan.set_percentage
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    percentage: !lambda |-
                                      return to_string((int) lroundf(x));
