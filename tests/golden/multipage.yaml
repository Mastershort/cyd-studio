script:
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: w_home_w1_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
      - lvgl.label.update:
          id: w_home_w1_date
          text: !lambda |-
            static const char *const days[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            static const char *const months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("");
            char buf[48];
            snprintf(buf, sizeof(buf), "%s, %d. %s", days[now.day_of_week - 1], now.day_of_month, months[now.month - 1]);
            return std::string(buf);
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - if:
          condition:
            lambda: !lambda |-
              return page == 2;
          then:
            - lvgl.widget.show: cyd_back
          else:
            - lvgl.widget.hide: cyd_back
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Start", "Klima", "Lichter"};
            if (page < 0 || page >= 3) return std::string("");
            return std::string(names[page]);
      - if:
          condition:
            lambda: !lambda |-
              return root == 0;
          then:
            - lvgl.label.update:
                id: cyd_tab_home_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_home_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_home_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_home_label
                text_color: 0x8B98A5
      - if:
          condition:
            lambda: !lambda |-
              return root == 1;
          then:
            - lvgl.label.update:
                id: cyd_tab_klima_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_klima_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_klima_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_klima_label
                text_color: 0x8B98A5

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 90
  page_wrap: false
  theme:
    button:
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      shadow_width: 0
      pad_all: 5
      text_color: 0xE6EDF3
      pressed:
        bg_color: 0x1B2430
      checked:
        bg_color: 0x1B2430
        border_color: 0x22D3EE
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      pad_all: 5
      shadow_width: 0
    - id: cyd_plain
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
      shadow_width: 0
    - id: cyd_bar
      bg_color: 0x0A0E14
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_navbar
      bg_color: 0x12171F
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
  on_idle:
    - timeout: 30s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 0 && id(cyd_page) != 2;
            then:
              - lvgl.page.show: page_home
    - timeout: 15s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) == 2;
            then:
              - lvgl.page.show: page_home
    - timeout: 60s
      then:
        - lambda: !lambda |-
            id(cyd_dimmed) = true;
        - light.turn_on:
            id: backlight
            brightness: "25%"
  top_layer:
    widgets:
      - obj:
          id: cyd_header
          x: 0
          y: 0
          width: 320
          height: 28
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                id: cyd_back
                align: LEFT_MID
                x: 0
                y: 0
                text_font: icons_20
                text: "\U000F0141"
                text_color: 0x22D3EE
                hidden: true
                on_short_click:
                  - if:
                      condition:
                        lambda: !lambda |-
                          return id(cyd_page) == 2;
                      then:
                        - lvgl.page.show:
                            id: page_home
                            animation: MOVE_RIGHT
                            time: 200ms
            - label:
                id: cyd_title
                align: LEFT_MID
                x: 26
                y: 0
                text_font: font_14
                text: Start
                text_color: 0xE6EDF3
            - label:
                id: cyd_header_time
                align: RIGHT_MID
                x: 0
                y: 0
                text_font: font_14
                text: "--:--"
                text_color: 0xE6EDF3
      - obj:
          id: cyd_tabbar
          x: 0
          y: 200
          width: 320
          height: 40
          styles: cyd_navbar
          scrollable: false
          clickable: false
          widgets:
            - button:
                id: cyd_tab_home
                x: 0
                y: 0
                width: 160
                height: 40
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_home
                widgets:
                  - label:
                      id: cyd_tab_home_icon
                      align: TOP_MID
                      x: 0
                      y: 2
                      text_font: icons_20
                      text: "\U000F02DC"
                      text_color: 0x22D3EE
                  - label:
                      id: cyd_tab_home_label
                      align: BOTTOM_MID
                      x: 0
                      y: -1
                      text_font: font_12
                      width: 158
                      long_mode: DOT
                      text_align: CENTER
                      text: Start
                      text_color: 0x22D3EE
            - button:
                id: cyd_tab_klima
                x: 160
                y: 0
                width: 160
                height: 40
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_klima
                widgets:
                  - label:
                      id: cyd_tab_klima_icon
                      align: TOP_MID
                      x: 0
                      y: 2
                      text_font: icons_20
                      text: "\U000F0393"
                      text_color: 0x8B98A5
                  - label:
                      id: cyd_tab_klima_label
                      align: BOTTOM_MID
                      x: 0
                      y: -1
                      text_font: font_12
                      width: 158
                      long_mode: DOT
                      text_align: CENTER
                      text: Klima
                      text_color: 0x8B98A5
  pages:
    - id: page_home
      bg_color: 0x0A0E14
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 0
            root: 0
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 200ms
      widgets:
        - obj:
