          y: 0
          width: 320
          height: 28
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                id: cyd_back
                align: LEFT_MID
                styles: cyd_text_10
                text: "\U000F0141"
                hidden: true
                on_short_click:
                  - if:
                      condition:
                        lambda: !lambda |-
                          return id(cyd_page) == 2;
                      then:
                        - lvgl.page.show:
                            id: page_home
                            animation: MOVE_RIGHT
                            time: 200ms
            - label:
                id: cyd_title
                align: LEFT_MID
                x: 26
                styles: cyd_text_7
                text: Start
            - label:
                id: cyd_header_time
                align: RIGHT_MID
                styles: cyd_text_7
                text: "--:--"
      - obj:
          id: cyd_tabbar
          x: 0
          y: 200
          width: 320
          height: 40
          styles: cyd_navbar
          scrollable: false
          clickable: false
          widgets:
            - button:
                id: cyd_tab_home
                x: 0
                y: 0
                width: 160
                height: 40
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_home
