                  - label:
                      id: cyd_tab_home_icon
                      align: TOP_MID
                      y: 2
                      styles: cyd_text_10
                      text: "\U000F02DC"
                  - label:
                      id: cyd_tab_home_label
                      align: BOTTOM_MID
