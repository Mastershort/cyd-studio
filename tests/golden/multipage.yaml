substitutions:
  device_name: cyd-wohnzimmer
  friendly_name: Wohnzimmer
  ent_binary_sensor_fenster_wohnzimmer: binary_sensor.fenster_wohnzimmer
  ent_cover_rollladen: cover.rollladen
  ent_light_wohnzimmer: light.wohnzimmer
  ent_script_alles_aus: script.alles_aus
  ent_sensor_wohnzimmer_co2: sensor.wohnzimmer_co2
  ent_sensor_wohnzimmer_luftfeuchte: sensor.wohnzimmer_luftfeuchte
  ent_sensor_wohnzimmer_temperatur: sensor.wohnzimmer_temperatur
  ent_switch_stehlampe: switch.stehlampe

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "zGm1uI0T3MdsCWDhYxJ9t3iX0N9kfjN7l6BUk4kP1Ro="

ota:
  - platform: esphome
    id: cyd_ota
    encryption:

wifi:
