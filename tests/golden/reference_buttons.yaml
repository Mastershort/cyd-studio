script:
  - id: cyd_show_message
    mode: restart
    parameters:
      title: string
      message: string
      duration: int
    then:
      - lvgl.label.update:
          id: cyd_msg_title
          text: !lambda |-
            return title;
      - lvgl.label.update:
          id: cyd_msg_text
          text: !lambda |-
            return message;
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - lvgl.widget.show: cyd_msg
      - if:
          condition:
            lambda: !lambda |-
              return duration > 0;
          then:
            - delay: !lambda |-
                return (uint32_t) duration * 1000;
            - lvgl.widget.hide: cyd_msg
  - id: cyd_overlay_open
    mode: restart
    parameters:
      entity: string
      title: string
      kind: int
      value: float
    then:
      - lambda: !lambda |-
          id(cyd_ov_entity) = entity;
          id(cyd_ov_kind) = kind;
      - lvgl.label.update:
          id: cyd_ov_title
          text: !lambda |-
            return title;
      - lvgl.slider.update:
          id: cyd_ov_slider
          value: !lambda |-
            return value;
      - lvgl.label.update:
          id: cyd_ov_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(value));
            return std::string(buf);
      - lvgl.widget.show: cyd_overlay
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: w_lockscreen_clock_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
      - lvgl.label.update:
          id: w_lockscreen_clock_date
          text: !lambda |-
            static const char *const days[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            static const char *const months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("");
            char buf[48];
            snprintf(buf, sizeof(buf), "%s, %d. %s", days[now.day_of_week - 1], now.day_of_month, months[now.month - 1]);
            return std::string(buf);
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;

