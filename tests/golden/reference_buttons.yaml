  rotation: 90
  page_wrap: false
  theme:
    button:
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      shadow_width: 0
      pad_all: 5
      text_color: 0xE6EDF3
      pressed:
        bg_color: 0x1B2430
      checked:
        bg_color: 0x1B2430
        bg_opa: COVER
        border_color: 0x22D3EE
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      pad_all: 5
      shadow_width: 0
