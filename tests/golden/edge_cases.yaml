    glyphs:
      - "\U000F0131\U000F0335"

script:
  - id: cyd_overlay_open
    mode: restart
    parameters:
      entity: string
      title: string
      kind: int
      value: float
    then:
      - lambda: !lambda |-
          id(cyd_ov_entity) = entity;
          id(cyd_ov_kind) = kind;
      - lvgl.label.update:
          id: cyd_ov_title
          text: !lambda |-
            return title;
      - lvgl.slider.update:
          id: cyd_ov_slider
          value: !lambda |-
            return value;
      - lvgl.label.update:
          id: cyd_ov_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(value));
            return std::string(buf);
      - lvgl.widget.show: cyd_overlay
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: w_eins_e_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--:--");
            return now.strftime("%H:%M:%S");
      - lvgl.label.update:
          id: w_eins_e_date
          text: !lambda |-
            static const char *const days[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            static const char *const months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("");
            char buf[48];
            snprintf(buf, sizeof(buf), "%s, %d. %s", days[now.day_of_week - 1], now.day_of_month, months[now.month - 1]);
            return std::string(buf);
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - if:
          condition:
            lambda: !lambda |-
              return root == 0;
          then:
            - lvgl.label.update:
                id: cyd_tab_eins_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_eins_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_eins_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_eins_label
                text_color: 0x8B98A5
      - if:
          condition:
            lambda: !lambda |-
              return root == 1;
          then:
            - lvgl.label.update:
                id: cyd_tab_zwei_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_zwei_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_zwei_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_zwei_label
                text_color: 0x8B98A5

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 0
  page_wrap: false
  theme:
    button:
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      shadow_width: 0
      pad_all: 5
      text_color: 0xE6EDF3
      pressed:
        bg_color: 0x1B2430
      checked:
        bg_color: 0x1B2430
        bg_opa: COVER
        border_color: 0x22D3EE
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      pad_all: 5
      shadow_width: 0
    - id: cyd_plain
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
      shadow_width: 0
    - id: cyd_bar
      bg_color: 0x0A0E14
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_navbar
      bg_color: 0x12171F
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_text_1
      text_font: icons_28
      text_color: 0x8B98A5
    - id: cyd_text_2
      text_font: font_14
      text_color: 0xE6EDF3
    - id: cyd_text_3
      text_font: font_12
      text_color: 0x8B98A5
    - id: cyd_text_4
      text_font: font_28
      text_color: 0xE6EDF3
    - id: cyd_text_5
      text_font: font_14
      text_color: 0xE6EDF3
      text_align: CENTER
    - id: cyd_text_6
      text_font: font_20
      text_color: 0xE6EDF3
      text_align: CENTER
    - id: cyd_text_7
      text_font: font_12
      text_color: 0x8B98A5
      text_align: CENTER
    - id: cyd_text_8
      text_font: icons_20
      text_color: 0xA3E635
    - id: cyd_text_9
      text_font: font_16
      text_color: 0xE6EDF3
    - id: cyd_text_10
      text_font: icons_28
      text_color: 0xA3E635
    - id: cyd_text_11
      text_font: font_14
      text_color: 0x8B98A5
    - id: cyd_text_12
      text_font: icons_20
      text_color: 0x8B98A5
    - id: cyd_text_13
      text_font: icons_20
      text_color: 0x22D3EE
    - id: cyd_text_14
      text_font: font_12
      text_color: 0x22D3EE
      text_align: CENTER
    - id: cyd_text_15
      text_font: font_28
      text_color: 0xE6EDF3
      text_align: CENTER
  on_idle:
    - timeout: 45s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 1 && id(cyd_page) != 1 && id(cyd_page) != 3;
            then:
              - lvgl.page.show: page_zwei
    - timeout: 10s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) == 3;
            then:
              - lvgl.page.show: page_zwei
    - timeout: 120s
      then:
        - lambda: !lambda |-
            id(cyd_dimmed) = true;
        - light.turn_off: backlight
  top_layer:
    widgets:
      - obj:
          id: cyd_header
          x: 0
          y: 0
          width: 320
          height: 24
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                align: CENTER
                styles: cyd_text_11
                text: "Ümlaut \"Test\": Küche & Bad"
      - obj:
          id: cyd_tabbar
          x: 0
          y: 24
          width: 48
          height: 216
          styles: cyd_navbar
          scrollable: false
          clickable: false
          widgets:
            - button:
                id: cyd_tab_eins
                x: 0
                y: 0
                width: 48
                height: 108
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_eins
                widgets:
                  - label:
                      id: cyd_tab_eins_icon
                      align: TOP_MID
                      y: 2
                      styles: cyd_text_12
                      text: "\U000F03A4"
                  - label:
                      id: cyd_tab_eins_label
                      align: BOTTOM_MID
                      y: -1
                      width: 46
                      long_mode: DOT
                      styles: cyd_text_7
                      text: "Eins mit sehr langem Seitennamen"
            - button:
                id: cyd_tab_zwei
                x: 0
                y: 108
                width: 48
                height: 108
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_zwei
                widgets:
                  - label:
                      id: cyd_tab_zwei_icon
                      align: TOP_MID
                      y: 2
                      styles: cyd_text_13
                      text: "\U000F03A7"
                  - label:
                      id: cyd_tab_zwei_label
                      align: BOTTOM_MID
                      y: -1
                      width: 46
                      long_mode: DOT
                      styles: cyd_text_14
                      text: Zwei
      - obj:
          id: cyd_overlay
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: "60%"
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: true
          scrollable: false
          on_short_click:
            - lvgl.widget.hide: cyd_overlay
          widgets:
            - obj:
                id: cyd_ov_panel
                x: 40
                y: 45
                width: 240
                height: 150
                styles: cyd_tile
                scrollable: false
                widgets:
                  - label:
                      id: cyd_ov_title
                      align: TOP_LEFT
                      width: 202
                      long_mode: DOT
                      styles: cyd_text_9
                      text: ""
                  - label:
                      id: cyd_ov_close
                      align: TOP_RIGHT
                      styles: cyd_text_12
                      text: "\U000F0156"
                      on_short_click:
                        - lvgl.widget.hide: cyd_overlay
                  - label:
                      id: cyd_ov_value
                      align: CENTER
                      y: -9
                      width: 228
                      long_mode: DOT
                      styles: cyd_text_15
                      text: ""
                  - slider:
                      id: cyd_ov_slider
                      align: BOTTOM_MID
                      x: 0
                      y: -9
                      width: 192
                      height: 18
                      min_value: 0
                      max_value: 100
                      value: 0
                      bg_color: 0x1F2933
                      bg_opa: COVER
                      indicator:
                        bg_color: 0x22D3EE
                        bg_opa: COVER
                      knob:
                        bg_color: 0xE6EDF3
                        bg_opa: COVER
                        pad_all: 4
                      on_value:
                        - lvgl.label.update:
                            id: cyd_ov_value
                            text: !lambda |-
                              char buf[12];
                              snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(x));
                              return std::string(buf);
                      on_release:
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 1;
                            then:
                              - homeassistant.action:
                                  action: light.turn_on
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    brightness_pct: !lambda |-
                                      return to_string((int) lroundf(x));
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 2;
                            then:
                              - homeassistant.action:
                                  action: cover.set_cover_position
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    position: !lambda |-
                                      return to_string((int) lroundf(x));
                        - if:
                            condition:
                              lambda: !lambda |-
                                return id(cyd_ov_kind) == 3;
                            then:
                              - homeassistant.action:
                                  action: fan.set_percentage
                                  data:
                                    entity_id: !lambda |-
                                      return id(cyd_ov_entity);
                                    percentage: !lambda |-
                                      return to_string((int) lroundf(x));
  pages:
    - id: page_eins
      bg_color: 0x0A0E14
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 0
            root: 0
      on_swipe_left:
