script:
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: w_eins_e_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--:--");
            return now.strftime("%H:%M:%S");
      - lvgl.label.update:
          id: w_eins_e_date
          text: !lambda |-
            static const char *const days[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            static const char *const months[] = {"Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("");
            char buf[48];
            snprintf(buf, sizeof(buf), "%s, %d. %s", days[now.day_of_week - 1], now.day_of_month, months[now.month - 1]);
            return std::string(buf);
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - if:
          condition:
            lambda: !lambda |-
              return root == 0;
          then:
            - lvgl.label.update:
                id: cyd_tab_eins_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_eins_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_eins_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_eins_label
                text_color: 0x8B98A5
      - if:
          condition:
            lambda: !lambda |-
              return root == 1;
          then:
            - lvgl.label.update:
                id: cyd_tab_zwei_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_zwei_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_zwei_icon
                text_color: 0x8B98A5
            - lvgl.label.update:
                id: cyd_tab_zwei_label
                text_color: 0x8B98A5

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 0
  page_wrap: false
  theme:
    button:
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      shadow_width: 0
      pad_all: 5
      text_color: 0xE6EDF3
      pressed:
        bg_color: 0x1B2430
      checked:
        bg_color: 0x1B2430
        border_color: 0x22D3EE
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      pad_all: 5
      shadow_width: 0
    - id: cyd_plain
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
      shadow_width: 0
    - id: cyd_bar
      bg_color: 0x0A0E14
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_navbar
      bg_color: 0x12171F
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
  on_idle:
    - timeout: 45s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 1 && id(cyd_page) != 1 && id(cyd_page) != 3;
            then:
              - lvgl.page.show: page_zwei
    - timeout: 10s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) == 3;
            then:
              - lvgl.page.show: page_zwei
    - timeout: 120s
      then:
        - lambda: !lambda |-
            id(cyd_dimmed) = true;
        - light.turn_off: backlight
  top_layer:
    widgets:
      - obj:
          id: cyd_header
          x: 0
          y: 0
          width: 320
          height: 24
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                align: CENTER
                x: 0
                y: 0
                text_font: font_14
                text: "Ümlaut \"Test\": Küche & Bad"
                text_color: 0x8B98A5
      - obj:
          id: cyd_tabbar
          x: 0
          y: 24
          width: 48
          height: 216
          styles: cyd_navbar
          scrollable: false
          clickable: false
          widgets:
            - button:
                id: cyd_tab_eins
                x: 0
                y: 0
                width: 48
                height: 108
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_eins
                widgets:
                  - label:
                      id: cyd_tab_eins_icon
                      align: TOP_MID
                      x: 0
                      y: 2
                      text_font: icons_20
                      text: "\U000F03A4"
                      text_color: 0x8B98A5
                  - label:
                      id: cyd_tab_eins_label
                      align: BOTTOM_MID
                      x: 0
                      y: -1
                      text_font: font_12
                      width: 46
                      long_mode: DOT
                      text_align: CENTER
                      text: "Eins mit sehr langem Seitennamen"
                      text_color: 0x8B98A5
            - button:
                id: cyd_tab_zwei
                x: 0
                y: 108
                width: 48
                height: 108
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_zwei
                widgets:
                  - label:
                      id: cyd_tab_zwei_icon
                      align: TOP_MID
                      x: 0
                      y: 2
                      text_font: icons_20
                      text: "\U000F03A7"
                      text_color: 0x22D3EE
                  - label:
                      id: cyd_tab_zwei_label
                      align: BOTTOM_MID
                      x: 0
                      y: -1
                      text_font: font_12
                      width: 46
                      long_mode: DOT
                      text_align: CENTER
                      text: Zwei
                      text_color: 0x22D3EE
  pages:
    - id: page_eins
      bg_color: 0x0A0E14
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 0
            root: 0
      on_swipe_left:
        - lvgl.page.next:
            animation: MOVE_LEFT
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: MOVE_RIGHT
            time: 200ms
      widgets:
        - button:
            id: w_eins_a
            x: 52
            y: 28
            width: 130
            height: 102
            scrollable: false
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data:
                    entity_id: "${ent_light_kueche}"
            widgets:
              - label:
                  id: w_eins_a_icon
                  align: TOP_LEFT
                  x: 0
                  y: 0
                  text_font: icons_28
                  text: "\U000F0335"
                  text_color: 0x8B98A5
              - label:
                  id: w_eins_a_state
                  align: TOP_RIGHT
                  x: 0
                  y: 0
                  text_font: font_12
                  width: 84
                  long_mode: DOT
                  text_align: RIGHT
                  text: "–"
                  text_color: 0x8B98A5
              - label:
                  id: w_eins_a_label
                  align: BOTTOM_LEFT
                  x: 0
                  y: 0
                  text_font: font_14
                  width: 118
                  long_mode: DOT
                  text_align: LEFT
                  text: "Küchenlicht mit einem wirklich sehr langen Namen"
                  text_color: 0xE6EDF3
        - button:
            id: w_eins_b
            x: 186
            y: 28
            width: 130
