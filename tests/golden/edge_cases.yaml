# ======================================================================
# Erzeugt von CYD Studio (Generator 0.1.0) – ESPHome >= 2026.9.0
# Projekt: Ümlaut "Test": Küche & Bad · Board: ESP32-2432S028R (Cheap Yellow Display 2,8″)
# Stand: 2026-09-24
#
# Änderungen bitte in CYD Studio vornehmen – sonst werden sie beim
# nächsten Export überschrieben.
#
# WLAN-Zugangsdaten kommen aus secrets.yaml (wifi_ssid, wifi_password).
# In Home Assistant beim ESPHome-Gerät „Dem Gerät erlauben,
# Home-Assistant-Aktionen auszuführen“ aktivieren – sonst reagieren
# die Schalter nicht.
#
# Hardware-Grundkonfiguration nach github.com/akuehlewind/ESPHome-touch-display-mount (MIT, (c) 2023 Adrian Kuehlewind)
# ======================================================================

substitutions:
  device_name: cyd-edge-cases
  friendly_name: "Ümlaut \"Test\": Küche & Bad"
  ent_light_kueche: light.kueche

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time
      - lvgl.page.show: page_zwei

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    id: cyd_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Ümlaut \"Test\": Küche Fallback"

captive_portal:

globals:
  - id: cyd_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: cyd_dimmed
    type: bool
    restore_value: false
    initial_value: "false"

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: cyd_update_time
    on_time:
      - seconds: "/1"
        then:
          - script.execute: cyd_update_time

spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: spi_display
    model: ILI9342
    color_order: RGB
    data_rate: 40MHz
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 20ms
    threshold: 300
    calibration:
      x_min: 340
      x_max: 3860
      y_min: 280
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    on_touch:
      - if:
          condition:
            lambda: !lambda |-
              return id(cyd_dimmed);
          then:
            - lambda: !lambda |-
                id(cyd_dimmed) = false;
            - light.turn_on:
                id: backlight
                brightness: "100%"

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display-Beleuchtung
    id: backlight
    restore_mode: ALWAYS_ON

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: homeassistant
    id: ha_light_kueche
    entity_id: "${ent_light_kueche}"
    on_value:
      then:
        - lvgl.widget.update:
            id: w_eins_a
            state:
              checked: !lambda |-
                return x == "on" || x == "open" || x == "opening" || x == "unlocked" || x == "home" || x == "playing";
              disabled: !lambda |-
                return x == "unavailable";
        - if:
            condition:
              lambda: !lambda |-
                return x == "on" || x == "open" || x == "opening" || x == "unlocked" || x == "home" || x == "playing";
            then:
              - lvgl.label.update:
                  id: w_eins_a_icon
                  text_color: 0xA3E635
            else:
              - lvgl.label.update:
                  id: w_eins_a_icon
                  text_color: 0x8B98A5
        - lvgl.label.update:
            id: w_eins_a_state
            text: !lambda |-
              if (x == "on") return std::string("An");
              if (x == "off") return std::string("Aus");
              if (x == "open") return std::string("Offen");
              if (x == "closed") return std::string("Geschlossen");
              if (x == "opening") return std::string("Öffnet");
              if (x == "closing") return std::string("Schließt");
              if (x == "locked") return std::string("Verriegelt");
              if (x == "unlocked") return std::string("Entriegelt");
              if (x == "unavailable") return std::string("Nicht verfügbar");
              if (x.empty() || x == "unknown") return std::string("–");
              return x;
        - lvgl.widget.update:
            id: w_eins_b
            state:
              checked: !lambda |-
                return x == "on" || x == "open" || x == "opening" || x == "unlocked" || x == "home" || x == "playing";
              disabled: !lambda |-
                return x == "unavailable";
        - lvgl.label.update:
            id: w_eins_b_state
            text: !lambda |-
              if (x == "on") return std::string("An");
              if (x == "off") return std::string("Aus");
              if (x == "open") return std::string("Offen");
              if (x == "closed") return std::string("Geschlossen");
              if (x == "opening") return std::string("Öffnet");
              if (x == "closing") return std::string("Schließt");
              if (x == "locked") return std::string("Verriegelt");
              if (x == "unlocked") return std::string("Entriegelt");
              if (x == "unavailable") return std::string("Nicht verfügbar");
              if (x.empty() || x == "unknown") return std::string("–");
              return x;
        - lvgl.label.update:
            id: w_eins_c_value
            text: !lambda |-
              if (x.empty() || x == "unknown" || x == "unavailable") return std::string("--");
              return x;

button:
  - platform: restart
    name: Neustart
    entity_category: diagnostic

