      - "\U000F033E\U000F0425\U000F081A"

script:
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: w_main_c_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%I:%M %p");
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Main", "Info", "Service"};
            if (page < 0 || page >= 3) return std::string("");
            return std::string(names[page]);
      - if:
          condition:
            lambda: !lambda |-
              return root == 0;
          then:
            - lvgl.label.update:
                id: cyd_tab_main_icon
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_main_icon
                text_color: 0x8B98A5
      - if:
          condition:
            lambda: !lambda |-
              return root == 1;
          then:
            - lvgl.label.update:
                id: cyd_tab_info_icon
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_info_icon
                text_color: 0x8B98A5

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 180
  page_wrap: true
  theme:
    button:
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      shadow_width: 0
      pad_all: 5
      text_color: 0xE6EDF3
      pressed:
        bg_color: 0x1B2430
      checked:
        bg_color: 0x1B2430
        bg_opa: COVER
        border_color: 0xF472B6
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      pad_all: 5
      shadow_width: 0
    - id: cyd_plain
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
      shadow_width: 0
    - id: cyd_bar
      bg_color: 0x0A0E14
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_navbar
      bg_color: 0x12171F
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_text_1
      text_font: font_28
      text_color: 0xE6EDF3
      text_align: CENTER
    - id: cyd_text_2
      text_font: icons_28
      text_color: 0x8B98A5
    - id: cyd_text_3
      text_font: font_14
      text_color: 0xE6EDF3
    - id: cyd_text_4
      text_font: font_12
      text_color: 0x8B98A5
    - id: cyd_text_5
      text_font: font_20
      text_color: 0xE6EDF3
    - id: cyd_text_6
      text_font: icons_28
      text_color: 0xA3E635
    - id: cyd_text_7
      text_font: icons_20
      text_color: 0xA3E635
    - id: cyd_text_8
      text_font: font_28
      text_color: 0xE6EDF3
    - id: cyd_text_9
      text_font: font_16
      text_color: 0x8B98A5
    - id: cyd_text_10
      text_font: icons_20
      text_color: 0x22D3EE
    - id: cyd_text_11
      text_font: icons_20
      text_color: 0x8B98A5
  on_idle:
    - timeout: 30s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 0;
            then:
              - lvgl.page.show: page_main
  top_layer:
    widgets:
      - obj:
          id: cyd_header
          x: 0
          y: 0
          width: 240
          height: 28
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                id: cyd_title
                align: LEFT_MID
                styles: cyd_text_3
                text: Main
            - label:
                id: cyd_header_time
                align: RIGHT_MID
                styles: cyd_text_3
                text: "--:--"
      - obj:
          id: cyd_tabbar
          x: 0
          y: 28
          width: 240
          height: 32
          styles: cyd_navbar
          scrollable: false
          clickable: false
          widgets:
            - button:
                id: cyd_tab_main
                x: 0
                y: 0
                width: 120
                height: 32
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_main
                widgets:
                  - label:
                      id: cyd_tab_main_icon
                      align: CENTER
                      styles: cyd_text_10
                      text: "\U000F02DC"
            - button:
                id: cyd_tab_info
                x: 120
                y: 0
                width: 120
                height: 32
                styles: cyd_tab
                scrollable: false
                on_short_click:
                  - lvgl.page.show: page_info
                widgets:
                  - label:
                      id: cyd_tab_info_icon
                      align: CENTER
                      styles: cyd_text_11
                      text: "\U000F02FC"
  pages:
    - id: page_main
      bg_color: 0x0A0E14
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 0
            root: 0
      on_swipe_left:
        - lvgl.page.next:
            animation: NONE
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: NONE
            time: 200ms
      widgets:
        - obj:
            id: w_main_c
            x: 6
            y: 66
            width: 228
            height: 57
            styles: cyd_plain
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: w_main_c_time
                  align: CENTER
                  width: 216
                  long_mode: DOT
                  styles: cyd_text_1
                  text: "--:--"
        - obj:
            id: w_main_door
            x: 6
            y: 129
            width: 228
            height: 58
            styles: cyd_tile
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: w_main_door_icon
                  align: LEFT_MID
                  styles: cyd_text_2
                  text: "\U000F081A"
              - label:
                  id: w_main_door_label
                  align: TOP_LEFT
                  x: 34
                  width: 182
                  long_mode: DOT
                  styles: cyd_text_3
                  text: "Front door"
              - label:
                  id: w_main_door_state
                  align: BOTTOM_LEFT
                  x: 34
                  width: 182
                  long_mode: DOT
                  styles: cyd_text_4
                  text: "–"
        - obj:
            id: w_main_lock
            x: 6
            y: 193
            width: 111
            height: 57
            styles: cyd_tile
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: w_main_lock_icon
                  align: LEFT_MID
                  styles: cyd_text_2
                  text: "\U000F033E"
              - label:
                  id: w_main_lock_label
                  align: TOP_LEFT
                  x: 34
                  width: 65
                  long_mode: DOT
                  styles: cyd_text_3
                  text: Lock
              - label:
                  id: w_main_lock_state
                  align: BOTTOM_LEFT
                  x: 34
                  width: 65
                  long_mode: DOT
                  styles: cyd_text_4
                  text: "–"
        - obj:
            id: w_main_power
            x: 123
            y: 193
            width: 111
            height: 57
            styles: cyd_tile
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: w_main_power_value
                  align: TOP_LEFT
                  width: 99
                  long_mode: DOT
                  styles: cyd_text_5
                  text: "--"
              - label:
                  align: BOTTOM_LEFT
                  width: 99
                  long_mode: DOT
                  styles: cyd_text_4
                  text: Power
        - button:
            id: w_main_all_off
            x: 6
            y: 256
            width: 228
            height: 58
            scrollable: false
            on_short_click:
              - homeassistant.action:
                  action: light.turn_off
                  data:
                    entity_id: all
                    transition: "2"
            widgets:
              - label:
                  align: LEFT_MID
                  styles: cyd_text_6
                  text: "\U000F0425"
              - label:
                  align: LEFT_MID
                  x: 34
                  width: 182
                  long_mode: DOT
                  styles: cyd_text_3
                  text: "All off"
    - id: page_info
      bg_color: 0x0A0E14
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 1
            root: 1
      on_swipe_left:
        - lvgl.page.next:
            animation: NONE
            time: 200ms
      on_swipe_right:
        - lvgl.page.previous:
            animation: NONE
            time: 200ms
      widgets:
        - obj:
            id: w_info_weather
            x: 6
            y: 66
            width: 228
            height: 121
            styles: cyd_tile
            scrollable: false
            clickable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  width: 190
                  long_mode: DOT
                  styles: cyd_text_4
                  text: Outside
              - label:
                  align: TOP_RIGHT
                  styles: cyd_text_7
                  text: "\U000F0595"
              - label:
                  id: w_info_weather_value
                  align: BOTTOM_LEFT
                  width: 216
                  long_mode: DOT
                  styles: cyd_text_8
                  text: "--"
        - obj:
            id: w_info_note
            x: 6
            y: 193
            width: 228
            height: 121
            styles: cyd_tile
            scrollable: false
            clickable: false
            widgets:
              - label:
                  align: CENTER
                  width: 216
                  long_mode: DOT
                  styles: cyd_text_1
                  text: "Have a nice day!"
    - id: page_hidden
      skip: true
      bg_color: 0x0A0E14
      bg_opa: COVER
      pad_all: 0
      on_load:
        - script.execute:
            id: cyd_on_page
            page: 2
            root: -1
      widgets:
        - obj:
            id: w_hidden_t
            x: 6
            y: 66
            width: 228
            height: 57
            styles: cyd_plain
            scrollable: false
            clickable: false
            widgets:
              - label:
                  align: LEFT_MID
                  width: 216
                  long_mode: DOT
                  styles: cyd_text_9
                  text: Service
