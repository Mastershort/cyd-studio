# ======================================================================
# Erzeugt von CYD Studio (Generator 0.3.0) – ESPHome >= 2026.9.0
# Projekt: Hallway · Board: ESP32-2432S028R (Cheap Yellow Display 2,8″)
# Stand: 2026-09-24
#
# Änderungen bitte in CYD Studio vornehmen – sonst werden sie beim
# nächsten Export überschrieben.
#
# WLAN-Zugangsdaten kommen aus secrets.yaml (wifi_ssid, wifi_password).
# In Home Assistant beim ESPHome-Gerät „Dem Gerät erlauben,
# Home-Assistant-Aktionen auszuführen“ aktivieren – sonst reagieren
# die Schalter nicht.
#
# Hardware-Grundkonfiguration nach github.com/akuehlewind/ESPHome-touch-display-mount (MIT, (c) 2023 Adrian Kuehlewind)
# ======================================================================

substitutions:
  device_name: cyd-hallway
  friendly_name: Hallway
  ent_binary_sensor_front_door: binary_sensor.front_door
  ent_lock_front_door: lock.front_door
  ent_sensor_outside_condition: sensor.outside_condition
  ent_sensor_power: sensor.power

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    id: cyd_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: cyd_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: cyd_tile_state
    type: "std::function<void(lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, const std::string &, float, int, const char *, const char *, const uint32_t *)>"
    restore_value: false
    initial_value: |-
      [](lv_obj_t *tile, lv_obj_t *icon, lv_obj_t *title, lv_obj_t *label, lv_obj_t *circle,
          const std::string &x, float value, int kind, const char *text_on, const char *text_off,
          const uint32_t *c) {
        // Tile state: checked when on/open, disabled when unavailable; colors c[] = on/off pairs of
        // icon, title, state text, icon circle. kind: 1 = brightness 0..255, 2/3 = percent, 0 = text only
        const bool on = x == "on" || x == "open" || x == "opening" || x == "unlocked" || x == "home" || x == "playing";
        const int k = on ? 0 : 1;
        if (tile != nullptr) {
          lv_obj_set_state(tile, LV_STATE_CHECKED, on);
          lv_obj_set_state(tile, LV_STATE_DISABLED, x == "unavailable");
        }
        if (icon != nullptr) lv_obj_set_style_text_color(icon, lv_color_hex(c[k]), LV_PART_MAIN);
        if (title != nullptr) lv_obj_set_style_text_color(title, lv_color_hex(c[2 + k]), LV_PART_MAIN);
        if (circle != nullptr) lv_obj_set_style_bg_color(circle, lv_color_hex(c[6 + k]), LV_PART_MAIN);
        if (label == nullptr) return;
        lv_obj_set_style_text_color(label, lv_color_hex(c[4 + k]), LV_PART_MAIN);
        std::string text;
        if (on && kind > 0 && !std::isnan(value)) {
          char buf[12];
          snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(kind == 1 ? value * 100.0f / 255.0f : value));
          text = buf;
        }
        else if (x == "unavailable") text = "Unavailable";
        else if (x.empty() || x == "unknown") text = "–";
        else if (x == "opening") text = "Opening";
        else if (x == "closing") text = "Closing";
        else if (on && text_on != nullptr) text = text_on;
        else if (!on && text_off != nullptr) text = text_off;
        else if (x == "on") text = "On";
        else if (x == "off") text = "Off";
        else if (x == "open") text = "Open";
        else if (x == "closed") text = "Closed";
        else if (x == "locked") text = "Locked";
        else if (x == "unlocked") text = "Unlocked";
        else text = x;
        lv_label_set_text(label, text.c_str());
      }

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: cyd_update_time
    on_time:
      - seconds: 0
        minutes: "/1"
        then:
          - script.execute: cyd_update_time

spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: spi_display
    model: ST7789V
    data_rate: 40MHz
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 20ms
    threshold: 300
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: ledc
    id: led_red
    pin: GPIO4
    inverted: true
  - platform: ledc
    id: led_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display backlight"
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: rgb
    name: "Status LED"
    id: status_led
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: ALWAYS_OFF

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic
  - platform: homeassistant
    id: ha_sensor_power_num
    entity_id: "${ent_sensor_power}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_main_power_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf) + " W";

text_sensor:
  - platform: homeassistant
    id: ha_binary_sensor_front_door
    entity_id: "${ent_binary_sensor_front_door}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xEF4444, 0xA3E635, 0xE6EDF3, 0xE6EDF3, 0x8B98A5, 0x8B98A5, 0x1B2430, 0x1B2430};
            id(cyd_tile_state)(nullptr, id(w_main_door_icon), nullptr, id(w_main_door_state), nullptr, x, NAN, 0, "Open", "Closed", c);
  - platform: homeassistant
    id: ha_lock_front_door
    entity_id: "${ent_lock_front_door}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0xF472B6, 0xA3E635, 0xE6EDF3, 0xE6EDF3, 0x8B98A5, 0x8B98A5, 0x1B2430, 0x1B2430};
            id(cyd_tile_state)(nullptr, id(w_main_lock_icon), nullptr, id(w_main_lock_state), nullptr, x, NAN, 0, "On", "Off", c);
  - platform: homeassistant
    id: ha_sensor_outside_condition
    entity_id: "${ent_sensor_outside_condition}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_info_weather_value
            text: !lambda |-
              if (x.empty() || x == "unknown" || x == "unavailable") return std::string("--");
              return x;

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

