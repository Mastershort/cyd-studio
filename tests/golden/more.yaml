script:
  - id: cyd_show_message
    mode: restart
    parameters:
      title: string
      message: string
      duration: int
    then:
      - lvgl.label.update:
          id: cyd_msg_title
          text: !lambda |-
            return title;
      - lvgl.label.update:
          id: cyd_msg_text
          text: !lambda |-
            return message;
      - lvgl.label.update:
          id: w_zwei_l_title
          text: !lambda |-
            return title;
      - lvgl.label.update:
          id: w_zwei_l_text
          text: !lambda |-
            return message;
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - lvgl.widget.show: cyd_msg
      - if:
          condition:
            lambda: !lambda |-
              return duration > 0;
          then:
            - delay: !lambda |-
                return (uint32_t) duration * 1000;
            - lvgl.widget.hide: cyd_msg
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: w_eins_c_value
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("–");
            const std::string st = id(ha_timer_waschmaschine).state;
            long rem = -2;
            if (st == "active") {
              const long end = id(cyd_parse_time)(id(ha_timer_waschmaschine_finishes_at).state);
              if (end > 0) rem = std::max(0L, end - (long) now.timestamp);
            }
            else if (st == "paused") rem = id(cyd_parse_duration)(id(ha_timer_waschmaschine_remaining).state);
            if (rem < 0) return std::string("–");
            char buf[16];
            if (rem >= 3600)
              snprintf(buf, sizeof(buf), "%ld:%02ld:%02ld", rem / 3600, (rem / 60) % 60, rem % 60);
            else snprintf(buf, sizeof(buf), "%02ld:%02ld", rem / 60, rem % 60);
            return std::string(buf);
      - lvgl.bar.update:
          id: w_eins_c_bar
          value: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return 0;
            const std::string st = id(ha_timer_waschmaschine).state;
            long rem = -2;
            if (st == "active") {
              const long end = id(cyd_parse_time)(id(ha_timer_waschmaschine_finishes_at).state);
              if (end > 0) rem = std::max(0L, end - (long) now.timestamp);
            }
            else if (st == "paused") rem = id(cyd_parse_duration)(id(ha_timer_waschmaschine_remaining).state);
            const long total = id(cyd_parse_duration)(id(ha_timer_waschmaschine_duration).state);
            if (rem < 0 || total <= 0) return 0;
            return (int) std::min(100L, std::max(0L, (total - rem) * 100 / total));
      - lvgl.label.update:
          id: w_eins_d_value
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("–");
            long rem = -2;
            const long end = id(cyd_parse_time)(id(ha_sensor_trockner_fertig).state);
            if (end > 0) rem = std::max(0L, end - (long) now.timestamp);
            if (rem < 0) return std::string("–");
            char buf[16];
            if (rem >= 3600)
              snprintf(buf, sizeof(buf), "%ld:%02ld:%02ld", rem / 3600, (rem / 60) % 60, rem % 60);
            else snprintf(buf, sizeof(buf), "%02ld:%02ld", rem / 60, rem % 60);
            return std::string(buf);
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Eins", "Zwei"};
            if (page < 0 || page >= 2) return std::string("");
            return std::string(names[page]);
      - if:
          condition:
            lambda: !lambda |-
              return root == 0;
          then:
            - lvgl.label.update:
                id: cyd_tab_eins_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_eins_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_eins_icon
                text_color: 0x5C5C5C
            - lvgl.label.update:
                id: cyd_tab_eins_label
                text_color: 0x5C5C5C
      - if:
          condition:
            lambda: !lambda |-
              return root == 1;
          then:
            - lvgl.label.update:
                id: cyd_tab_zwei_icon
                text_color: 0x22D3EE
            - lvgl.label.update:
                id: cyd_tab_zwei_label
                text_color: 0x22D3EE
          else:
            - lvgl.label.update:
                id: cyd_tab_zwei_icon
                text_color: 0x5C5C5C
            - lvgl.label.update:
                id: cyd_tab_zwei_label
                text_color: 0x5C5C5C

