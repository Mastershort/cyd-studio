# ======================================================================
# Erzeugt von CYD Studio (Generator 0.7.0) – ESPHome >= 2026.9.0
# Projekt: Mehr · Board: ESP32-2432S028R (Cheap Yellow Display 2,8″)
# Stand: 2026-09-24
#
# Änderungen bitte in CYD Studio vornehmen – sonst werden sie beim
# nächsten Export überschrieben.
#
# WLAN-Zugangsdaten kommen aus secrets.yaml (wifi_ssid, wifi_password).
# In Home Assistant beim ESPHome-Gerät „Dem Gerät erlauben,
# Home-Assistant-Aktionen auszuführen“ aktivieren – sonst reagieren
# die Schalter nicht.
#
# Hardware-Grundkonfiguration nach github.com/akuehlewind/ESPHome-touch-display-mount (MIT, (c) 2023 Adrian Kuehlewind)
# ======================================================================

substitutions:
  device_name: cyd-more
  friendly_name: Mehr
  ent_counter_gaeste: counter.gaeste
  ent_input_number_soll: input_number.soll
  ent_input_select_heizmodus: input_select.heizmodus
  ent_input_text_link: input_text.link
  ent_light_flur: light.flur
  ent_person_anna: person.anna
  ent_scene_kino: scene.kino
  ent_script_alles_aus: script.alles_aus
  ent_sensor_trockner_fertig: sensor.trockner_fertig
  ent_timer_waschmaschine: timer.waschmaschine

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  min_version: 2026.9.0
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - script.execute: cyd_update_time

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  actions:
    - action: show_page
      variables:
        page: string
      then:
        - light.turn_on:
            id: backlight
            brightness: "100%"
        - if:
            condition:
              lambda: !lambda |-
                return page == "Eins" || page == "eins";
            then:
              - lvgl.page.show: page_eins
        - if:
            condition:
              lambda: !lambda |-
                return page == "Zwei" || page == "zwei";
            then:
              - lvgl.page.show: page_zwei
    - action: show_message
      variables:
        title: string
        message: string
        duration: int
      then:
        - script.execute:
            id: cyd_show_message
            title: !lambda |-
              return title.str();
            message: !lambda |-
              return message.str();
            duration: !lambda |-
              return duration;
    - action: wake
      then:
        - light.turn_on:
            id: backlight
            brightness: "100%"
    - action: dim
      then:
        - light.turn_on:
            id: backlight
            brightness: "25%"
    - action: set_brightness
      variables:
        brightness: int
      then:
        - light.turn_on:
            id: backlight
            brightness: !lambda |-
              return std::max(1, std::min(100, (int) brightness)) / 100.0f;
    - action: set_led
      variables:
        red: int
        green: int
        blue: int
      then:
        - if:
            condition:
              lambda: !lambda |-
                return (int) red <= 0 && (int) green <= 0 && (int) blue <= 0;
            then:
              - light.turn_off: status_led
            else:
              - light.turn_on:
                  id: status_led
                  brightness: "100%"
                  red: !lambda |-
                    return std::min(255, std::max(0, (int) red)) / 255.0f;
                  green: !lambda |-
                    return std::min(255, std::max(0, (int) green)) / 255.0f;
                  blue: !lambda |-
                    return std::min(255, std::max(0, (int) blue)) / 255.0f;

ota:
  - platform: esphome
    id: cyd_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Mehr Fallback"

captive_portal:

globals:
  - id: cyd_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: cyd_tile_state
    type: "std::function<void(lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, lv_obj_t *, const std::string &, float, int, const char *, const char *, const uint32_t *)>"
    restore_value: false
    initial_value: |-
      [](lv_obj_t *tile, lv_obj_t *icon, lv_obj_t *title, lv_obj_t *label, lv_obj_t *circle,
          const std::string &x, float value, int kind, const char *text_on, const char *text_off,
          const uint32_t *c) {
        // Tile state: checked when on/open, disabled when unavailable; colors c[] = on/off pairs of
        // icon, title, state text, icon circle. kind: 1 = brightness 0..255, 2/3 = percent, 0 = text only
        const bool on = x == "on" || x == "open" || x == "opening" || x == "unlocked" || x == "home" || x == "playing";
        const int k = on ? 0 : 1;
        if (tile != nullptr) {
          lv_obj_set_state(tile, LV_STATE_CHECKED, on);
          lv_obj_set_state(tile, LV_STATE_DISABLED, x == "unavailable");
        }
        if (icon != nullptr) lv_obj_set_style_text_color(icon, lv_color_hex(c[k]), LV_PART_MAIN);
        if (title != nullptr) lv_obj_set_style_text_color(title, lv_color_hex(c[2 + k]), LV_PART_MAIN);
        if (circle != nullptr) lv_obj_set_style_bg_color(circle, lv_color_hex(c[6 + k]), LV_PART_MAIN);
        if (label == nullptr) return;
        lv_obj_set_style_text_color(label, lv_color_hex(c[4 + k]), LV_PART_MAIN);
        std::string text;
        if (on && kind > 0 && !std::isnan(value)) {
          char buf[12];
          snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(kind == 1 ? value * 100.0f / 255.0f : value));
          text = buf;
        }
        else if (x == "unavailable") text = "Nicht verfügbar";
        else if (x.empty() || x == "unknown") text = "–";
        else if (x == "opening") text = "Öffnet";
        else if (x == "closing") text = "Schließt";
        else if (on && text_on != nullptr) text = text_on;
        else if (!on && text_off != nullptr) text = text_off;
        else if (x == "on") text = "An";
        else if (x == "off") text = "Aus";
        else if (x == "open") text = "Offen";
        else if (x == "closed") text = "Geschlossen";
        else if (x == "locked") text = "Verriegelt";
        else if (x == "unlocked") text = "Entriegelt";
        else text = x;
        lv_label_set_text(label, text.c_str());
      }
  - id: cyd_parse_time
    type: "std::function<long(const std::string &)>"
    restore_value: false
    initial_value: |-
      [](const std::string &s) -> long {
        // ISO date/time from Home Assistant -> UTC epoch seconds (-1 if not parseable)
        int y, mo, d, h, mi, se;
        char sep;
        if (sscanf(s.c_str(), "%d-%d-%d%c%d:%d:%d", &y, &mo, &d, &sep, &h, &mi, &se) != 7) return -1;
        y -= mo <= 2;
        const long era = (y >= 0 ? y : y - 399) / 400;
        const long yoe = y - era * 400;
        const long doy = (153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5 + d - 1;
        const long doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
        const long t = (era * 146097 + doe - 719468) * 86400L + h * 3600L + mi * 60L + se;
        const size_t p = s.find_first_of("+-Z", 19);
        if (p == std::string::npos) return t - ESPTime::timezone_offset();  // local time
        if (s[p] == 'Z') return t;
        int oh = 0, om = 0;
        sscanf(s.c_str() + p + 1, "%d:%d", &oh, &om);
        const long off = oh * 3600L + om * 60L;
        return s[p] == '+' ? t - off : t + off;
      }
  - id: cyd_parse_duration
    type: "std::function<long(const std::string &)>"
    restore_value: false
    initial_value: |-
      [](const std::string &s) -> long {
        // "H:MM:SS" -> seconds (-1 if not parseable)
        int h, m, sec;
        if (sscanf(s.c_str(), "%d:%d:%d", &h, &m, &sec) != 3) return -1;
        return h * 3600L + m * 60L + sec;
      }

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: cyd_update_time
    on_time:
      - seconds: "/1"
        then:
          - script.execute: cyd_update_time

spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: cyd_display
    spi_id: spi_display
    model: ILI9341
    color_order: BGR
    data_rate: 10MHz
    cs_pin:
      number: 15
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      ignore_strapping_warning: true
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: 33
    interrupt_pin: 36
    update_interval: 20ms
    threshold: 300
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - platform: ledc
    id: led_red
    pin: GPIO4
    inverted: true
  - platform: ledc
    id: led_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display-Beleuchtung
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: rgb
    name: Status-LED
    id: status_led
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: ALWAYS_OFF

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    update_interval: 60s
    entity_category: diagnostic
  - platform: homeassistant
    id: ha_input_number_soll_num
    entity_id: "${ent_input_number_soll}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_eins_n_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.1f", x);
              return std::string(buf) + " °C";
  - platform: homeassistant
    id: ha_counter_gaeste_num
    entity_id: "${ent_counter_gaeste}"
    on_value:
      then:
        - lvgl.label.update:
            id: w_eins_z_value
            text: !lambda |-
              if (std::isnan(x)) return std::string("--");
              char buf[24];
              snprintf(buf, sizeof(buf), "%.0f", x);
              return std::string(buf);

