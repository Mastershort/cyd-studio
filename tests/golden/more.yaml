                    - homeassistant.action:
                        action: input_number.set_value
                        data:
                          entity_id: "${ent_input_number_soll}"
                          value: !lambda |-
                            float v = id(ha_input_number_soll_num).state;
                            if (std::isnan(v)) v = 10.0f;
                            v = std::min(30.0f, std::max(10.0f, v + (-0.5f)));
                            char buf[16];
                            snprintf(buf, sizeof(buf), "%.1f", v);
                            return std::string(buf);
