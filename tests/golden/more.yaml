    id: ha_timer_waschmaschine_finishes_at
    entity_id: "${ent_timer_waschmaschine}"
    attribute: finishes_at
    on_value:
      then: []
  - platform: homeassistant
    id: ha_timer_waschmaschine_remaining
    entity_id: "${ent_timer_waschmaschine}"
    attribute: remaining
    on_value:
      then: []
  - platform: homeassistant
    id: ha_timer_waschmaschine_duration
    entity_id: "${ent_timer_waschmaschine}"
    attribute: duration
    on_value:
      then: []
  - platform: homeassistant
    id: ha_sensor_trockner_fertig
    entity_id: "${ent_sensor_trockner_fertig}"
    on_value:
      then: []
  - platform: homeassistant
    id: ha_person_anna
    entity_id: "${ent_person_anna}"
    on_value:
      then:
        - lambda: !lambda |-
            static const uint32_t c[] = {0x22D3EE, 0x5C5C5C, 0xD9D9D9, 0xD9D9D9, 0x7A7A7A, 0x7A7A7A, 0x22D3EE, 0x141414};
            id(cyd_tile_state)(nullptr, id(w_zwei_p_icon), nullptr, id(w_zwei_p_state), nullptr, x, NAN, 0, "Zuhause", "Unterwegs", c);
  - platform: homeassistant
    id: ha_input_text_link
    entity_id: "${ent_input_text_link}"
    on_value:
      then:
        - lvgl.qrcode.update:
            id: w_zwei_q2_qr
            text: !lambda |-
              return x.empty() ? std::string(" ") : x;

