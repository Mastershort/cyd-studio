script:
  - id: cyd_show_message
    mode: restart
    parameters:
      title: string
      message: string
      duration: int
    then:
      - lvgl.label.update:
          id: cyd_msg_title
          text: !lambda |-
            return title;
      - lvgl.label.update:
          id: cyd_msg_text
          text: !lambda |-
            return message;
      - light.turn_on:
          id: backlight
          brightness: "100%"
      - lvgl.widget.show: cyd_msg
      - if:
          condition:
            lambda: !lambda |-
              return duration > 0;
          then:
            - delay: !lambda |-
                return (uint32_t) duration * 1000;
            - lvgl.widget.hide: cyd_msg
  - id: cyd_overlay_open
    mode: restart
    parameters:
      entity: string
      title: string
      kind: int
      value: float
    then:
      - lambda: !lambda |-
          id(cyd_ov_entity) = entity;
          id(cyd_ov_kind) = kind;
      - lvgl.label.update:
          id: cyd_ov_title
          text: !lambda |-
            return title;
      - lvgl.slider.update:
          id: cyd_ov_slider
          value: !lambda |-
            return value;
      - lvgl.label.update:
          id: cyd_ov_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(value));
            return std::string(buf);
      - lvgl.widget.show: cyd_overlay
  - id: cyd_light_open
    mode: restart
    parameters:
      entity: string
      title: string
      value: float
      modes: string
      ct: float
      hs: string
    then:
      - lambda: !lambda |-
          id(cyd_ov_entity) = entity;
          const bool has_ct = modes.find("color_temp") != std::string::npos;
          const bool has_hs = modes.find("hs") != std::string::npos || modes.find("rgb") != std::string::npos ||
                              modes.find("xy") != std::string::npos;
          // hs_color arrives as text, e.g. "(30.0, 100.0)"
          float hue = 0.0f, sat = 100.0f;
          const size_t p = hs.find_first_of("0123456789");
          if (p != std::string::npos) sscanf(hs.c_str() + p, "%f, %f", &hue, &sat);
          id(cyd_li_sat) = sat < 10.0f ? 100.0f : sat;
          const float k = std::isnan(ct) ? 4000.0f : ct;
          lv_label_set_text(id(cyd_li_title), title.c_str());
          char buf[12];
          lv_slider_set_value(id(cyd_li_brightness), (int32_t) lroundf(value), LV_ANIM_OFF);
          snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(value));
          lv_label_set_text(id(cyd_li_brightness_value), buf);
          lv_slider_set_value(id(cyd_li_ct), (int32_t) lroundf(k), LV_ANIM_OFF);
          snprintf(buf, sizeof(buf), "%d K", (int) lroundf(k));
          lv_label_set_text(id(cyd_li_ct_value), buf);
          lv_slider_set_value(id(cyd_li_hue), (int32_t) lroundf(hue), LV_ANIM_OFF);
          snprintf(buf, sizeof(buf), "%d°", (int) lroundf(hue));
          lv_label_set_text(id(cyd_li_hue_value), buf);
          for (lv_obj_t *o : {id(cyd_li_ct_icon), id(cyd_li_ct), id(cyd_li_ct_value)}) {
            if (has_ct) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          for (lv_obj_t *o : {id(cyd_li_hue_icon), id(cyd_li_hue), id(cyd_li_hue_value)}) {
            if (has_hs) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
      - lvgl.widget.show: cyd_light
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Office"};
            if (page < 0 || page >= 1) return std::string("");
            return std::string(names[page]);

