                        bg_color: 0x22D3EE
                        bg_opa: COVER
                      knob:
                        bg_color: 0xE6EDF3
                        bg_opa: COVER
                        pad_all: 4
                      on_value:
                        - lvgl.label.update:
                            id: cyd_ov_value
                            text: !lambda |-
                              char buf[12];
