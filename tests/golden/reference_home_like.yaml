script:
  - id: cyd_overlay_open
    mode: restart
    parameters:
      entity: string
      title: string
      kind: int
      value: float
    then:
      - lambda: !lambda |-
          id(cyd_ov_entity) = entity;
          id(cyd_ov_kind) = kind;
      - lvgl.label.update:
          id: cyd_ov_title
          text: !lambda |-
            return title;
      - lvgl.slider.update:
          id: cyd_ov_slider
          value: !lambda |-
            return value;
      - lvgl.label.update:
          id: cyd_ov_value
          text: !lambda |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%d %%", (int) lroundf(value));
            return std::string(buf);
      - lvgl.widget.show: cyd_overlay
  - id: cyd_update_time
    mode: restart
    then:
      - lvgl.label.update:
          id: cyd_header_time
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
  - id: cyd_on_page
    mode: restart
    parameters:
      page: int
      root: int
    then:
      - lambda: !lambda |-
          id(cyd_page) = page;
      - lvgl.label.update:
          id: cyd_title
          text: !lambda |-
            static const char *const names[] = {"Office"};
            if (page < 0 || page >= 1) return std::string("");
            return std::string(names[page]);

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touch
  rotation: 90
  page_wrap: false
  theme:
    button:
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      shadow_width: 0
      pad_all: 5
      text_color: 0xE6EDF3
      pressed:
        bg_color: 0x1B2430
      checked:
        bg_color: 0x1B2430
        bg_opa: COVER
        border_color: 0x22D3EE
      disabled:
        bg_opa: "50%"
  style_definitions:
    - id: cyd_tile
      bg_color: 0x12171F
      bg_opa: COVER
      radius: 10
      border_width: 1
      border_color: 0x1F2933
      pad_all: 5
      shadow_width: 0
    - id: cyd_plain
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
      shadow_width: 0
    - id: cyd_bar
      bg_color: 0x0A0E14
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_navbar
      bg_color: 0x12171F
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_tab
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      shadow_width: 0
    - id: cyd_text_1
      text_font: icons_28
      text_color: 0x8B98A5
    - id: cyd_text_2
      text_font: font_14
      text_color: 0xE6EDF3
    - id: cyd_text_3
      text_font: font_12
      text_color: 0x8B98A5
    - id: cyd_text_4
      text_font: font_16
      text_color: 0xE6EDF3
    - id: cyd_text_5
      text_font: icons_20
      text_color: 0x8B98A5
    - id: cyd_text_6
      text_font: font_28
      text_color: 0xE6EDF3
      text_align: CENTER
  on_idle:
    - timeout: 30s
      then:
        - if:
            condition:
              lambda: !lambda |-
                return id(cyd_page) != 0;
            then:
              - lvgl.page.show: page_home
    - timeout: 10s
      then:
        - lambda: !lambda |-
            id(cyd_dimmed) = true;
        - light.turn_on:
            id: backlight
            brightness: "40%"
  top_layer:
    widgets:
      - obj:
          id: cyd_header
          x: 0
          y: 0
          width: 320
          height: 28
          styles: cyd_bar
          pad_left: 6
          pad_right: 6
          scrollable: false
          clickable: false
          widgets:
            - label:
                id: cyd_title
                align: LEFT_MID
                styles: cyd_text_2
                text: Office
            - label:
                id: cyd_header_time
                align: RIGHT_MID
                styles: cyd_text_2
                text: "--:--"
      - obj:
          id: cyd_overlay
          x: 0
          y: 0
          width: 320
          height: 240
          bg_color: 0x000000
          bg_opa: "60%"
          border_width: 0
          radius: 0
          pad_all: 0
          hidden: true
          scrollable: false
          on_short_click:
            - lvgl.widget.hide: cyd_overlay
