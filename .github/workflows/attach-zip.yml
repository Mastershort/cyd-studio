name: Attach release zip

# Packs the integration as cyd_studio.zip and attaches it to a release. HACS installs exactly this file
# (hacs.json sets zip_release), so the asset's download count is the number of HACS installs and
# updates of that version. Runs for every published release; "Run workflow" with a tag attaches the
# zip to an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/cyd_studio/manifest.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match manifest version $version" >&2
            exit 1
          fi
      - name: Pack the integration
        run: |
          cd custom_components/cyd_studio
          find . -name '__pycache__' -prune -o -type f -print | sed 's|^\./||' | sort > /tmp/files
          zip -q -X ../../cyd_studio.zip -@ < /tmp/files
          cd ../..
          unzip -l cyd_studio.zip | tail -1
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" cyd_studio.zip --clobber
