name: ESPHome

# Generated code must be accepted by ESPHome: `config` on every push,
# `compile` for all golden files nightly and before a release. Red = no release.
on:
  push:
  pull_request:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  release:
    types: [prereleased]

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pyyaml
      - name: Golden files are up to date
        run: pytest -q tests/test_generator.py
      - run: bash tools/validate_esphome.sh config

  # C++ in lambdas is only checked by a real compile: compile every golden file changed by a push
  compile-changed:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Changed golden files
        id: changed
        run: |
          files=$(git diff --name-only HEAD~1 -- 'tests/golden/*.yaml' | xargs -r -n1 basename | paste -sd ' ' -)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.files != ''
        run: bash tools/validate_esphome.sh compile ${{ steps.changed.outputs.files }}

  compile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/validate_esphome.sh compile
